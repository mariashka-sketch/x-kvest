<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гео-квест">
<meta name="theme-color" content="#0f0b17">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Гео-квест: геометрия 7 класса на живых чертежах — лучи, углы, градусы, смежные и вертикальные, треугольники. И котики.">
<title>Гео-квест</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Икс-квест — оформление. Тёмная тема, крупные формулы, клавиатура под большой палец. */
:root {
  --bg: #0f0b17; --bg2: #160f23; --card: #1d1531; --card2: #271d3f; --line: #362a54;
  --ink: #f8f5ff; --mute: #cdc4e2; --dim: #9a8fb6;
  --pink: #ff4f8b; --blue: #4aa8ff; --lime: #b8f04a; --gold: #ffcf4a; --violet: #c08cff; --okc: #3fe08f; --badc: #ff6070;
  --acc: var(--pink); --acc-ink: #1a0f22; --minus: #ff4f8b;
}
.day1 { --acc: var(--pink); }
.day2 { --acc: var(--blue); }
.day3 { --acc: var(--lime); }
.day4 { --acc: var(--gold); }
.day5 { --acc: var(--violet); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink);
  background: radial-gradient(120% 55% at 50% -12%, #2c1749 0%, var(--bg) 62%) fixed var(--bg);
  font: 20px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
#app {
  max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 18px);
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
h1 { font-size: 38px; line-height: 1.08; margin: 8px 0 10px; letter-spacing: -.02em; }
h2 { font-size: 27px; line-height: 1.15; margin: 4px 0 4px; letter-spacing: -.01em; }
h3 { font-size: 23px; margin: 20px 0 8px; }
h4 { font-size: 19px; margin: 14px 0 6px; color: var(--mute); }
p { margin: 8px 0; }
.sub { color: var(--mute); font-size: 18px; }

/* ---------- формулы ---------- */
.m, .math, .tile, .ans, .errl, .ln, .ex, .tbl td { font-variant-numeric: tabular-nums lining-nums; }
.m i, .math i, .ans i, .tile i, .errl i, .ln i, .k i, .tbl i, .ex i, .opt i, .tilebtn i {
  font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic; font-weight: 600; padding: 0 .04em;
}
.mn { color: var(--minus); font-weight: 900; }
.nw { white-space: nowrap; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .68em; line-height: 1.08; margin: 0 .12em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .2em .05em; }
.fr > span:last-child { padding-top: .05em; }
.m { font-weight: 700; }

/* ---------- кнопки ---------- */
.btn {
  display: block; width: 100%; padding: 16px 18px; margin-top: 12px; border-radius: 18px;
  background: var(--acc); color: var(--acc-ink); font-weight: 800; font-size: 21px; text-align: center;
  box-shadow: 0 10px 26px -12px var(--acc);
}
.btn.big { font-size: 23px; padding: 19px; }
.btn.ghost { background: var(--card2); color: var(--ink); box-shadow: none; }
.btn.danger { color: var(--badc); }
.btn:active, .opt:active, .node:active, .tile:active, .errl:active, .catcard:active { transform: scale(.97); }
.ico { width: 44px; height: 44px; border-radius: 14px; background: var(--card); font-size: 24px; display: grid; place-items: center; }

/* ---------- шапка и шкала ---------- */
.bar { display: grid; grid-template-columns: 44px 1fr 76px; align-items: center; gap: 8px; min-height: 48px; }
.bar .ttl { text-align: center; font-weight: 800; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .meta { text-align: right; font-weight: 800; font-size: 19px; color: var(--mute); white-space: nowrap; }
.hearts { font-size: 17px; letter-spacing: -1px; }
.prog { height: 10px; border-radius: 99px; background: var(--card2); margin: 6px 0 10px; overflow: hidden; flex: none; }
.prog i { display: block; height: 100%; border-radius: 99px; background: var(--acc); transition: width .45s cubic-bezier(.2, .9, .3, 1.2); }

/* ---------- экран задачи ---------- */
#app.scr-play { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
.stage { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding: 2px 0 10px; }
.task { background: var(--card); border-radius: 22px; padding: 16px; margin-top: auto; flex: none; }
.task.big { margin: auto 0; padding: 20px 16px; }
.lead { color: var(--mute); font-size: 19px; font-weight: 600; }
.lead.story-lead { color: var(--ink); font-size: 22px; line-height: 1.38; }
.task.big .lead { font-size: 21px; }
.math { font-size: 40px; font-weight: 700; line-height: 1.25; margin: 6px 0 12px; letter-spacing: -.01em; }
.task.big .math { font-size: 50px; }
.math.rows { text-align: center; line-height: 1.15; }
.math .qm { display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 12px; border: 2px dashed var(--acc); color: var(--acc); font-size: .8em; }
.tip { font-size: 17px; color: var(--gold); margin: 2px 0 10px; }
.ans {
  display: flex; align-items: center; gap: 8px; min-height: 66px; padding: 8px 14px; border-radius: 16px;
  background: var(--bg2); border: 2px solid var(--line); font-size: 38px; font-weight: 700; transition: border-color .2s, background .2s;
}
.ans .pre { color: var(--mute); }
.ans .ph { color: var(--dim); }
.ans .val { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.ans { flex-wrap: wrap; row-gap: 2px; }
.caret { display: inline-block; vertical-align: -.14em; margin-left: 5px; width: 3px; height: 1.05em; background: var(--acc); border-radius: 2px; animation: blink 1s steps(1) infinite; }
.ans.right { border-color: var(--okc); background: rgba(63, 224, 143, .13); }
.ans.right .caret { display: none; }
@keyframes blink { 50% { opacity: 0; } }
.hintbtn { margin-top: 12px; font-size: 18px; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; }

.story { background: var(--card); border-radius: 18px; padding: 14px 16px; font-size: 20px; line-height: 1.42; flex: none; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 21px; flex: none; }
.tbl th { font-size: 16px; color: var(--mute); font-weight: 700; text-align: left; padding: 2px 4px; }
.tbl thead th { text-align: center; }
.tbl td { background: var(--card); border-radius: 10px; padding: 9px 6px; text-align: center; font-weight: 700; }
.tbl td.cur { box-shadow: inset 0 0 0 2px var(--acc); }
.tbl .q { color: var(--dim); }
.grid-paper, .note, .ex {
  background-color: var(--bg2);
  background-image: linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
  background-size: 18px 18px;
}
.note { border-radius: 16px; padding: 10px 14px; font-size: 26px; font-weight: 700; flex: none; }
.note .ln { padding: 3px 0; }
.note .ln.new { animation: pop .5s cubic-bezier(.2, .9, .3, 1.4); color: var(--acc); }
@keyframes pop { 0% { transform: translateY(8px) scale(.94); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* клавиатура */
.foot { flex: none; }
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.sp { padding: 12px 6px; border-radius: 14px; background: var(--card2); font-weight: 800; font-size: 19px; border: 2px dashed var(--line); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.k {
  height: 56px; border-radius: 15px; background: var(--card2); font-size: 31px; font-weight: 700;
  display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .28);
}
.k:active { transform: translateY(1px) scale(.97); filter: brightness(1.3); }
.k.op { background: #2c2147; color: var(--mute); }
.k.var { color: var(--acc); font-size: 35px; }
.k.ok { background: var(--acc); color: var(--acc-ink); font-size: 23px; font-weight: 900; }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; } .span4 { grid-column: span 4; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { padding: 15px 16px; border-radius: 16px; background: var(--card2); text-align: left; font-size: 21px; font-weight: 700; border: 2px solid var(--line); }
.opt .m { font-size: 26px; }
.opts.cmp { flex-direction: row; }
.opts.cmp .opt { flex: 1; text-align: center; font-size: 40px; }
.opts.cmp .opt .m { font-size: inherit; }
.foot-hint { color: var(--mute); text-align: center; font-size: 18px; padding: 10px 0 6px; }

/* плитки «перенос через =» */
.tiles { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 12px 0 4px; }
.side { display: flex; flex-wrap: wrap; align-content: center; gap: 6px; min-height: 62px; padding: 8px; border-radius: 16px; background: var(--bg2); }
.sl { justify-content: flex-end; } .sr { justify-content: flex-start; }
.eqs { font-size: 40px; font-weight: 900; color: var(--mute); }
.tile { padding: 9px 11px; border-radius: 13px; font-size: 27px; font-weight: 800; background: var(--card2); border: 2px solid var(--line); min-width: 52px; }
.tile.tv { border-color: rgba(74, 168, 255, .55); }
.tile.moved { animation: flip .6s cubic-bezier(.2, .9, .3, 1.3); border-color: var(--acc); }
@keyframes flip { 0% { transform: rotateY(90deg) scale(.6); opacity: .2; } 100% { transform: none; opacity: 1; } }
.tilebtn { font-size: 40px !important; }

/* найди ошибку */
.errs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.errl { text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--bg2); border: 2px solid var(--line); font-size: 26px; font-weight: 700; }

/* ---------- шторка, тост, конфетти ---------- */
#scrim { position: fixed; inset: 0; background: rgba(6, 3, 12, .6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
#scrim.on { opacity: 1; pointer-events: auto; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; display: flex; justify-content: center; pointer-events: none; }
#sheet .in {
  pointer-events: auto; width: 100%; max-width: 520px; max-height: 84vh; max-height: 84dvh; overflow: auto;
  background: var(--card); border-radius: 26px 26px 0 0; padding: 22px 18px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .9, .3, 1.05); box-shadow: 0 -12px 40px rgba(0, 0, 0, .5);
}
#sheet.on .in { transform: none; }
#sheet:not(.on) .in { visibility: hidden; transition: transform .3s, visibility 0s .3s; }
.fb h3 { margin: 0 0 6px; font-size: 27px; }
.fb.bad h3 { color: var(--badc); }
.fb.good h3 { color: var(--okc); }
.fb p { font-size: 21px; }
.fb .q { font-size: 22px; font-weight: 600; }
.fb-cat { float: right; margin: -6px -4px 0 8px; }
.how { margin-top: 14px; color: var(--mute); font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .07em; }
.steps { margin: 6px 0 4px; padding-left: 26px; font-size: 22px; }
.steps li { margin: 7px 0; }
.hl { margin-top: 12px; font-weight: 700; color: var(--mute); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.two .btn { margin: 0; }
.catinfo { text-align: center; }
#toast { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 62px); display: flex; justify-content: center; pointer-events: none; z-index: 60; padding: 0 16px; }
#toast .t { max-width: 480px; padding: 12px 16px; border-radius: 16px; font-weight: 700; font-size: 19px; background: var(--card2); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transform: translateY(-14px); opacity: 0; transition: transform .22s, opacity .22s; }
#toast.on .t { transform: none; opacity: 1; }
#toast .t.ok { background: #15402e; color: #b5f7d3; }
#toast .t.warn { background: #3d3112; color: #ffe39a; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; display: none; }

/* ---------- карта ---------- */
.top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.logo { font-size: 32px; font-weight: 900; letter-spacing: -.03em; }
.logo span { color: var(--lime); }
.hi, .says { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.says { align-items: flex-start; margin: 6px 0 14px; }
.cat { flex: none; display: block; }
.bubble { position: relative; flex: 1; background: var(--card); padding: 11px 14px; border-radius: 16px; font-weight: 600; font-size: 19px; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 18px; border: 8px solid transparent; border-right-color: var(--card); border-left: 0; }
.prize-bar { background: var(--card); border-radius: 18px; padding: 12px 14px; margin: 8px 0 4px; }
.pb-t { display: flex; justify-content: space-between; font-size: 18px; color: var(--mute); }
.pb-t b { color: var(--ink); }
.pb { height: 10px; border-radius: 99px; background: var(--bg2); margin: 8px 0 6px; overflow: hidden; }
.pb i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--blue), var(--lime)); border-radius: 99px; }
.pb-s { font-size: 16px; color: var(--dim); }
.go { margin-top: 12px; }
.day { margin-top: 16px; padding: 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; }
.day::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--acc); }
.day.locked { opacity: .5; }
.dhead { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--acc); }
.dok { color: var(--okc); }
.day p { color: var(--mute); font-size: 18px; margin: 2px 0 12px; }
.nodes { display: flex; flex-wrap: wrap; gap: 6px; }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 21px; background: var(--card2); border: 2px solid var(--line); }
.node.open { border-color: var(--acc); color: var(--acc); }
.node.cur { background: var(--acc); color: var(--acc-ink); animation: pulse 1.5s infinite; }
.node.done { background: var(--bg2); border-color: var(--acc); }
.node.boss { border-radius: 14px; font-size: 20px; }
.node.done svg { width: 38px; height: 38px; }
.node.lock { opacity: .55; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .35); } 70% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
.links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.links button { background: var(--card); border-radius: 16px; padding: 14px 4px; font-size: 16px; font-weight: 700; }

/* ---------- карточка уровня ---------- */
.kick { font-size: 15px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--acc); margin-top: 6px; }
.rules { display: flex; flex-direction: column; gap: 8px; }
.rule { background: var(--card); border-left: 4px solid var(--acc); border-radius: 14px; padding: 12px 14px; font-size: 21px; font-weight: 600; }
.ex { margin-top: 12px; border-radius: 16px; padding: 12px 14px; font-size: 26px; font-weight: 700; }
.ex-h { font-size: 15px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; font-weight: 800; }
.ex-l { opacity: 0; animation: fadeup .5s forwards; padding: 2px 0; }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.goal { margin-top: 14px; color: var(--mute); font-size: 18px; }
.reward { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 18px; color: var(--mute); }

/* ---------- финалы ---------- */
.center { text-align: center; padding-top: 10px; }
.burst { display: grid; place-items: center; margin: 6px auto 0; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .13) 0%, transparent 68%); animation: popin .7s cubic-bezier(.2, .9, .3, 1.5); }
@keyframes popin { from { transform: scale(.4) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
.kicker { font-size: 16px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--acc); }
.power { font-size: 21px; color: var(--mute); max-width: 380px; margin: 6px auto 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats div { background: var(--card); border-radius: 16px; padding: 12px 4px; }
.stats b { display: block; font-size: 32px; }
.stats span { font-size: 15px; color: var(--mute); }
.daydone { background: var(--card); border-radius: 16px; padding: 12px 14px; font-weight: 700; margin: 6px 0; }
.catrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin: 8px 0 14px; }
.prizebox { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: linear-gradient(135deg, rgba(255, 79, 139, .2), rgba(74, 168, 255, .16)); border: 1px solid var(--line); border-radius: 18px; padding: 14px; font-size: 19px; margin: 12px 0; }
.prizebox > span { font-size: 30px; line-height: 1; }
.tipbox { background: #2d2610; color: #ffe39a; border-radius: 16px; padding: 12px 14px; font-size: 18px; text-align: left; margin: 10px 0; }
.form label { display: block; text-align: left; font-size: 17px; color: var(--mute); font-weight: 700; margin-top: 12px; }
.form input, .form textarea, .pinbox input {
  display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg2); color: var(--ink); font: inherit; font-size: 20px; resize: vertical;
}
.villain { vertical-align: middle; }

/* ---------- коллекция, шпаргалка, мама ---------- */
.catgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.catcard { background: var(--card); border-radius: 18px; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 17px; }
.catcard svg { width: 76px; height: 76px; }
.catcard.lock b { color: var(--dim); }
.cs { background: var(--card); border-radius: 18px; padding: 14px 16px; margin-top: 12px; border-left: 4px solid var(--acc); }
.cs h3 { margin: 0 0 6px; font-size: 21px; }
.cs p { font-size: 19px; margin: 6px 0; }
.csx { margin-top: 8px; padding: 8px 12px; border-radius: 12px; font-size: 22px; font-weight: 700; background: var(--bg2); }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.kpi div { background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center; }
.kpi b { display: block; font-size: 30px; }
.kpi span { font-size: 15px; color: var(--mute); }
.tags, .lv, .days { list-style: none; padding: 0; margin: 0; }
.tags li { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-top: 8px; }
.tg { display: flex; justify-content: space-between; gap: 8px; font-size: 18px; font-weight: 700; }
.bar2 { height: 8px; border-radius: 99px; background: var(--bg2); margin: 8px 0 4px; overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--okc); border-radius: 99px; }
.bar2 i.mid { background: var(--gold); } .bar2 i.low { background: var(--badc); }
.tgn { font-size: 15px; color: var(--mute); }
.lv li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 18px; }
.lv li.ok { color: var(--ink); } .lv li:not(.ok) { color: var(--mute); }
.lv .n { color: var(--mute); white-space: nowrap; }
.days li { padding: 4px 0; color: var(--mute); }
.pinbox { margin-top: 18px; background: var(--card); border-radius: 16px; padding: 12px 14px; }
.pinbox summary { font-weight: 700; color: var(--mute); }
.order { background: var(--card); border-radius: 16px; padding: 12px 14px; white-space: pre-wrap; font-size: 18px; }

@media (max-height: 720px) {
  .k { height: 50px; font-size: 28px; }
  .math { font-size: 34px; margin-bottom: 8px; }
  .task.big .math { font-size: 42px; }
  .ans { min-height: 58px; font-size: 32px; }
  .note { font-size: 22px; }
  .story { font-size: 19px; }
  .lead.story-lead { font-size: 20px; }
}
@media (max-height: 690px) {

<script>
/* Икс-квест — математика: точные дроби, линейные выражения, разбор ввода, вёрстка формул.
   Работает и в браузере (глобальный XM), и в Node (module.exports) — для тестов. */
(function (root) {
'use strict';

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

/* ---------- Q: точная дробь n/d ---------- */
class Q {
  constructor(n, d = 1) {
    if (!Number.isInteger(n) || !Number.isInteger(d) || d === 0) throw new Error(`bad Q ${n}/${d}`);
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    this.n = n / g || 0;      // || 0 убирает −0
    this.d = d / g;
  }
  static of(x) {
    if (x instanceof Q) return x;
    if (typeof x === 'number') {
      if (Number.isInteger(x)) return new Q(x, 1);
      const s = String(x);
      if (/e/i.test(s)) throw new Error('Q.of: ' + s);
      const k = s.split('.')[1].length;

  }
  add(o) { o = Q.of(o); return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = Q.of(o); return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = Q.of(o); return new Q(this.n * o.n, this.d * o.d); }
  div(o) { o = Q.of(o); if (o.n === 0) throw new Error('div0'); return new Q(this.n * o.d, this.d * o.n); }

  abs() { return new Q(Math.abs(this.n), this.d); }

  isInt() { return this.d === 1; }

/* Сколько знаков после запятой у конечной десятичной дроби; −1 — если бесконечная. */
function decDigits(q) {
  let d = q.d, two = 0, five = 0;

/* ---------- Мини-разметка формул ----------
   «-» — минус, «*» — точка умножения, {n/d} — дробь столбиком, латинские буквы — переменные.
   В тексте формулы берутся в `обратные кавычки`. */
function fmtAbs(q) {
  if (q.d === 1) return String(q.n);
  const k = decDigits(q);

/* Абсолютная часть слагаемого: 3x, x, 0,5a, {1/3}x, 7 */
function termAbs(t) {

function fmtTerms(terms) {

    const neg = Q.of(t.c).sign() < 0;

   Понимает: 12, -7, 0,5, 9/7, 3a-b, -x+9, 22b - 7, x/3, 1/3x.
   Возвращает { ok, terms, lin, reduced } или { ok:false, err }. */
function parseInput(raw) {
  const s = String(raw).replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(/\./g, ',');
  const fail = err => ({ ok: false, err });
  if (!s) return fail('Сначала введи ответ');
  const terms = [];
  let i = 0;
  while (i < s.length) {
    let sign = 1;
    if (s[i] === '+' || s[i] === '-') {
      sign = s[i] === '-' ? -1 : 1; i++;
      if (s[i] === '+' || s[i] === '-') return fail('Два знака подряд — оставь один');
      if (i >= s.length) return fail('В конце висит знак — допиши или сотри');
    } else if (terms.length) return fail('Не понимаю запись');
    let num = null;
    const mNum = /^\d+(,\d+)?/.exec(s.slice(i));
    if (mNum) {
      const [int, frac = ''] = mNum[0].split(',');
      num = new Q(parseInt(int + frac, 10), 10 ** frac.length);
      i += mNum[0].length;
      if (s[i] === '/') {
        const m2 = /^\/(\d+)/.exec(s.slice(i));
        if (!m2) return fail('После «/» нужно число');
        if (+m2[1] === 0) return fail('На ноль делить нельзя');
        num = num.div(+m2[1]); i += m2[0].length;
      }
    } else if (s[i] === ',') return fail('Запятая без цифры впереди');
    let v = '';
    if (/[a-z]/.test(s[i] || '')) {
      v = s[i]; i++;
      if (s[i] === '/') {
        const m3 = /^\/(\d+)/.exec(s.slice(i));
        if (!m3) return fail('После «/» нужно число');
        if (+m3[1] === 0) return fail('На ноль делить нельзя');
        num = (num || ONE).div(+m3[1]); i += m3[0].length;
      }
    }
    if (num === null && !v) return fail('Не понимаю запись');
    if (i < s.length && s[i] !== '+' && s[i] !== '-') {
      if (s[i] === ',') return fail('Лишняя запятая');
      return fail('Не понимаю запись — между частями нужен знак');

  for (const t of terms) {
    if (seen[t.v]) reduced = false;
    seen[t.v] = true;
    if (t.c.isZero() && terms.length > 1) reduced = false;

    if (OPS.has(tok[k]) && k + 1 < tok.length) { parts.push(`<span class="nw">${atomHTML(tok[k])} ${atomHTML(tok[k + 1])}</span>`); k++; }

<script>
/* Гео-квест — геометрия и живые чертежи.
   Сцена: точки + элементы (прямая, луч, отрезок, дуга угла, транспортир, треугольник…) в координатах

   Работает и в браузере (GEO), и в Node — для тестов. */

const INK2 = '#d9def2';     // «чёрные» линии учебника — на тёмном фоне светлые

   {t:'arc',v,a,b,r,color,label,id,fill}  — дуга угла от луча v→a к лучу v→b (короткая сторона или `ccw:true`)
   {t:'right',v,a,b}  {t:'protractor',v,a,b,r}  {t:'text',x,y,s,cls}  {t:'tick',a,b,n}  {t:'hit',id,kind,...}

function threeLines(kinds) {

/* два угла рядом: ∠1 слева, ∠2 справа; возвращает сцену и градусы */
function twoAngles(d1, d2, { l1 = 70, l2 = 70, ids = ['g1', 'g2'], labels = ['1', '2'] } = {}) {
  const O1 = P(Math.max(70, 8 + Math.ceil(l1 * 0.66)), 170), O2 = P(Math.min(235, 312 - l2), 170), b1 = rnd.int(-8, 14), b2 = rnd.int(-8, 14);
  const points = { O1, A1: polar(O1, b1, l1), B1: polar(O1, b1 + d1, l1), O2, A2: polar(O2, b2, l2), B2: polar(O2, b2 + d2, l2) };
  const items = [arc('O1', 'A1', 'B1', { r: 26, id: ids[0], label: labels[0], color: 'blue' }), arc('O2', 'A2', 'B2', { r: 26, id: ids[1], label: labels[1], color: 'pink' }),
    ray('O1', 'A1', { len: l1 }), ray('O1', 'B1', { len: l1 }), ray('O2', 'A2', { len: l2, color: 'pink' }), ray('O2', 'B2', { len: l2, color: 'pink' }),
    pt('O1', { label: false, r: 4 }), pt('O2', { label: false, r: 4 })];
  return sc(points, items, { h: 230 });
}
/* наложение: копия ∠1 (пунктиром) на ∠2 */
function overlayScene(d1, d2) {
  const O = P(150, 175), bd = rnd.int(-5, 12);
  const points = { O, A: polar(O, bd, 125), B: polar(O, bd + d2, 125), B1: polar(O, bd + d1, 105) };
  const items = [arc('O', 'A', 'B', { r: 34, color: 'pink', label: '2' }), arc('O', 'A', 'B1', { r: 22, color: 'blue', label: '1', lr: 16 }),
    ray('O', 'A', { len: 125, color: 'pink' }), ray('O', 'B', { len: 125, color: 'pink' }), ray('O', 'B1', { len: 105, color: 'blue', dash: true }), pt('O', { label: false })];
  return sc(points, items, { h: 230 });
}
function genOverlayEq(form) {

    const s = twoAngles(x, y);
    const bigger = x > y ? '∠1' : '∠2';
    return predict('overlayEq', 'Какой угол больше — ∠1 или ∠2?', s,
      opts(bigger, [x > y ? '∠2' : '∠1', 'Наложи и посмотри: один угол помещается внутри другого.'], ['Они равны', 'При наложении они не совпадут.']),
      { lead: 'Наложили ∠1 на ∠2 так, чтобы одна сторона совпала. Смотри, где вторая сторона.', fig: overlayScene(x, y), readout: () => `${bigger} больше`, done: `Вторая сторона ${x > y ? '∠2 оказалась внутри ∠1' : '∠1 оказалась внутри ∠2'} → ${bigger} больше.` },
      { explain: ['Чтобы сравнить углы, их накладывают так, чтобы совпали вершины и одна сторона. Чья вторая сторона внутри — тот угол меньше.'] });
  }

  if (form === 'tap') {
    const L1 = rnd.int(80, 110), L2 = L1 + rnd.int(50, 90), swap = rnd.p(0.5);
    const [a, b] = swap ? [L2, L1] : [L1, L2];

    const s = sc(points, [seg('A', 'B', { id: 's1', w: 5 }), seg('C', 'D', { id: 's2', w: 5, color: 'pink' }), pt('A', { dy: -22, dx: 0 }), pt('B', { dy: -22, dx: 0 }), pt('C', { dy: 24, dx: 0 }), pt('D', { dy: 24, dx: 0 })], { h: 210 });

  }

    () => tf('overlayEq', 'Если две фигуры совместились при наложении, они равны.', true, 'Так и определяют равенство фигур.'),
    () => tf('overlayEq', 'Равные отрезки могут иметь разную длину.', false, 'Равные отрезки совмещаются, значит и длины у них одинаковые.'),
    () => tf('overlayEq', 'Если отрезок AC — часть отрезка AB, то AC < AB.', true, 'Часть меньше целого.'),
  ])();
}
function genSegCompare(form) {

    const points = {}, items = [];
    Ls.forEach((L, i) => { const p = 'P' + i, q = 'Q' + i; points[p] = P(40, 60 + i * 60); points[q] = P(40 + L, 60 + i * 60); items.push(seg(p, q, { id: 's' + i, w: 5, color: ['blue', 'pink', 'lime'][i] }), pt(p, { label: ['A', 'C', 'E'][i], dy: -22, dx: 0 }), pt(q, { label: ['B', 'D', 'F'][i], dy: -22, dx: 0 })); });

  }

      check: p => (dist(p.A, p.C) > dist(p.C, p.B) * 1.15 ? { ok: true } : { ok: false, msg: 'Пока AC не больше CB. Двигай C ближе к B — тогда AC растёт, а CB уменьшается.' }),

function genMidpoint(form) {

    const s = segScene(rnd.pick([0.2, 0.3, 0.75]), { dragC: true });
    const cm = x => (x / 20).toFixed(1).replace('.', ',');
    return drag('midpoint', 'Поставь точку C в середину отрезка AB.', s, {
      check: p => (Math.abs(projT(p.A, p.B, p.C) - 0.5) <= 0.035 ? { ok: true } : { ok: false, msg: 'Середина — когда AC = CB. Смотри на числа под чертежом и выравнивай их.' }),
      solve: p => ({ ...p, C: mid(p.A, p.B) }),
      readout: p => `AC = ${cm(dist(p.A, p.C))} см · CB = ${cm(dist(p.C, p.B))} см`,

}

    () => tf('angleCompare', 'Чем длиннее стороны угла, тем он больше.', false, 'Стороны — лучи, они бесконечны. Размер угла — это раствор между сторонами.'),

}

  if (form === 'name') {
    const s = angleScene(deg, { len: 125 }); const O = s.points.O, bd = dir(O, s.points.A);

}

/* ================= МИССИЯ 3. ГРАДУСЫ ================= */

function protScene(deg, { dragB = false, one = false } = {}) {
  const s = angleScene(deg, { baseDir: 0, len: 145, ox: 160, oy: 190, h: 250, dragB, noArc: true });
  s.items.unshift({ t: 'protractor', v: 'O', a: 'A', b: 'B', r: 132, one });
  s.items.splice(1, 0, arc('O', 'A', 'B', { r: 22, color: 'pink', label: '' }));
  return s;
}

      check: p => (Math.abs(ang(p.O, p.A, p.B) - deg) <= 3 ? { ok: true } : { ok: false, msg: Math.abs(ang(p.O, p.A, p.B) - (180 - deg)) <= 4 ? `Это ${180 - deg}° по другой шкале. Считай по шкале, где ноль на луче OA.` : `Сейчас ${fmtDeg(ang(p.O, p.A, p.B))}. Смотри на шкалу, где ноль стоит на луче OA.` }),

}

    else s.items.push({ t: 'tick', a: 'A', b: 'B', n: 1 }, { t: 'tick', a: 'M', b: 'N', n: 1 }, { t: 'tick', a: 'B', b: 'C', n: 2 }, { t: 'tick', a: 'N', b: 'K', n: 2 });

/* ---------- проверка ответа ----------
   ok — верно; bad — ошибка (msg); retry — не засчитываем (пустой ввод, не та запись). */
function check(task, input) {
  switch (task.type) {
    case 'choice': {
      const o = task.options[input.choice];
      return o.ok ? { ok: true } : { bad: true, msg: o.why || task.explain[0] || 'Не то.' };
    }
    case 'finderr':
      if (input.line === task.wrong) return { ok: true };
      return { bad: true, msg: input.line < task.wrong ? 'Эта строчка верная. Ошибка появилась ниже.' : 'Ошибка появилась раньше — проверь строчки выше.' };
    case 'tap': {
      const sel = (input.sel || []).slice().sort(), ans = task.answer.slice().sort();
      if (!sel.length) return { retry: true, msg: task.multi ? 'Нажми на нужные элементы чертежа' : 'Нажми на нужный элемент чертежа' };
      if (sel.length === ans.length && sel.every((x, i) => x === ans[i])) return { ok: true };
      const wrong = sel.find(x => !ans.includes(x));
      if (wrong && task.traps && task.traps[wrong]) return { bad: true, msg: task.traps[wrong] };
      if (!wrong && task.multi) return { bad: true, msg: 'Не всё выбрано — нужных элементов больше.' };
      return { bad: true, msg: task.explain[0] };
    }
    case 'drag': {
      const r = task.check(input.points);
      return r.ok ? { ok: true } : { bad: true, msg: r.msg || task.explain[0] };
    }
    case 'predict': {
      const o = task.options[input.choice];
      return o.ok ? { ok: true } : { bad: true, msg: o.why || task.explain[0] };
    }
    case 'name': {
      const str = (input.str || '').replace(/\s+/g, '');
      if (!str) return { retry: true, msg: 'Собери ответ из плиток' };
      if (task.answers.includes(str)) return { ok: true };
      const t = task.traps && task.traps(str);
      if (t) return { bad: true, msg: t };
      const need = task.answers[0].length;
      if (str.length < need) return { retry: true, msg: 'Не хватает плиток — добавь ещё' };
      return { bad: true, msg: task.explain[0] };
    }
    case 'num': {
      const raw = String(input.str == null ? input : input.str).trim().replace(',', '.');
      if (raw === '') return { retry: true, msg: 'Сначала введи число' };
      const v = Number(raw);
      if (!isFinite(v)) return { retry: true, msg: 'Нужно число' };
      if (Math.abs(v - task.answer) < 1e-9) return { ok: true };
      const key = Object.keys(task.traps || {}).find(k => Math.abs(Number(k) - v) < 1e-9);
      if (key) return { bad: true, msg: task.traps[key] };
      return { bad: true, msg: 'Не сходится. Смотри, как надо:' };
    }
  }
  return { bad: true, msg: '?' };
}

<script>
/* Гео-квест — движок усвоения.
   Учёт идёт по понятиям, а не по уровням. Понятие усвоено после NEED верных подряд,
   среди которых минимум два разных вида задания. Ошибка обнуляет серию, и следующее задание
   по этому понятию приходит в другой форме (не той, на которой ошиблась).
   Повторялка: каждое REVIEW_EVERY-е задание уровня — по понятию из прошлых уровней; провал снимает
   «усвоено», и такое «потерянное» понятие повторялка спрашивает в первую очередь, пока не вернёт. */
(function (root) {
'use strict';
const NEED = 3, MIN_FORMS = 2, REVIEW_EVERY = 5;

const fresh = () => ({ streak: 0, recent: [], mastered: false, avoid: null, ok: 0, bad: 0, last: null, lastAt: 0, traps: 0 });
const get = (M, id) => (M[id] = M[id] || fresh());
const isMastered = (M, id) => !!(M[id] && M[id].mastered);
function formsOK(recent) { return recent.length >= NEED && new Set(recent.slice(-NEED)).size >= MIN_FORMS; }

/* record(M, conceptId, form, ok) → {mastered:bool, justMastered:bool, lost:bool} */
function record(M, id, form, ok) {
  const m = get(M, id), was = m.mastered;
  m.last = form; m.lastAt = Date.now();
  if (ok) {
    m.ok++; m.streak++; m.recent.push(form); if (m.recent.length > 6) m.recent.shift();
    m.avoid = null;
    if (m.streak >= NEED && formsOK(m.recent)) m.mastered = true;
  } else {
    m.bad++; m.streak = 0; m.recent = []; m.avoid = form; m.mastered = false;
  }
  return { mastered: m.mastered, justMastered: !was && m.mastered, lost: was && !m.mastered };
}

/* Выбор следующего задания уровня.
   concepts — понятия уровня; allForms — {id: [формы]}; reviewPool — усвоенные понятия прошлых миссий;
   n — номер задания в уровне (с 0); lastId — предыдущее понятие (чтобы чередовать). */
function pickNext(M, concepts, allForms, reviewPool, n, lastId, rnd = Math.random) {
  const open = concepts.filter(c => !isMastered(M, c));
  if (!open.length) return null;
  let id;
  // повторялка: сначала «потерянные» темы (были усвоены, но провалены на повторе), потом усвоенные
  const review = reviewPool.filter(c => !concepts.includes(c) && M[c] && (M[c].ok + M[c].bad) > 0);
  const lost = review.filter(c => !M[c].mastered);
  if (review.length && n > 0 && (n + 1) % REVIEW_EVERY === 0) {
    const src = lost.length ? lost : review;
    id = src[Math.floor(rnd() * src.length)];
    return { id, form: pickForm(M, id, allForms[id], rnd), review: true, lost: !M[id].mastered };
  }
  // чередуем: берём не то, что было только что (если есть выбор), с наименьшей серией
  let cand = open.length > 1 ? open.filter(c => c !== lastId) : open;
  const minStreak = Math.min(...cand.map(c => get(M, c).streak));
  cand = cand.filter(c => get(M, c).streak === minStreak);
  id = cand[Math.floor(rnd() * cand.length)];
  return { id, form: pickForm(M, id, allForms[id], rnd), review: false };
}
/* Форма: не та, на которой ошиблась; предпочитаем ещё не встречавшуюся в текущей серии,
   чтобы к третьему верному ответу было минимум две разных. */
function pickForm(M, id, forms, rnd = Math.random) {
  const m = get(M, id);
  let cand = forms.filter(f => f !== m.avoid);
  if (!cand.length) cand = forms.slice();
  const unseen = cand.filter(f => !m.recent.includes(f));
  const pool = (m.streak >= 1 && unseen.length) ? unseen : (unseen.length && rnd() < 0.7 ? unseen : cand);
  return pool[Math.floor(rnd() * pool.length)];
}
/* прогресс уровня 0…1 */
function progress(M, concepts) {
  const s = concepts.reduce((a, c) => a + (isMastered(M, c) ? NEED : Math.min(NEED, get(M, c).streak)), 0);
  return s / (NEED * concepts.length);
}
const levelDone = (M, concepts) => concepts.every(c => isMastered(M, c));

const GM = { NEED, MIN_FORMS, REVIEW_EVERY, fresh, get, isMastered, record, pickNext, pickForm, progress, levelDone };
if (typeof module !== 'undefined' && module.exports) module.exports = GM; else root.GM = GM;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  return '';
}
/* живой чертёж */
function mountFig() {
  const el = document.getElementById('fig'); if (!el) return;
  const t = curTask(), reveal = run.phase === 'reveal';
  const scene = reveal ? t.reveal.fig : t.fig;
  const ro = reveal ? t.reveal.readout : t.readout;
  run.fig = GEO.mount(el, scene, {
    sel: run.sel,
    extra: ro ? p => GEO.readout(ro(p)) : '',
    locked: () => run.lock || sheetOpen(),
    onTap: id => {
      if (t.type !== 'tap' || reveal || run.lock || sheetOpen()) return;
      sfx.tap();
      run.sel = run.fig.toggle(id, t.multi);
      if (!t.multi) { run.lock = true; setTimeout(() => { run.lock = false; submit({ sel: run.sel }); }, 220); }
    },
    onChange: () => { if (!reveal) run.touched = true; },
  });
}

/* ---------- ответ ---------- */
function rec(t, good, trapHit) {
  const l = lv(run.lvl.id); good ? l.ok++ : l.bad++;
  if (trapHit) S.traps[t.concept] = (S.traps[t.concept] || 0) + 1;
  return GM.record(S.mastery, t.concept, t.form, good);
}
function submit(input) {
  if (!run || run.lock || sheetOpen()) return;
  const t = curTask();
  if (run.phase === 'reveal') return;
  if (input == null) {
    if (t.type === 'num') input = { str: run.input };
    else if (t.type === 'name') input = { str: run.tiles.map(i => t.tiles[i]).join('') };
    else if (t.type === 'tap') input = { sel: run.sel };
    else if (t.type === 'drag') input = { points: run.fig.scene.points };
  }
  tick();
  const r = check(t, input);
  if (r.retry) { sfx.warn(); return toast(r.msg, 'warn', 3000); }
  if (r.ok) onOk(t); else onBad(t, r, input);
}
function praise(t) {
  if (XK.STREAK[run.streak]) return XK.STREAK[run.streak];
  return pick(CONCEPTS[t.concept].trapTitle && Math.random() < 0.4 ? XK.PRAISE_TRAP : XK.PRAISE);
}
function onOk(t) {
  run.streak++; run.ok++; run.best = Math.max(run.best, run.streak); S.bestStreak = Math.max(S.bestStreak, run.streak); S.solved++;
  const m = rec(t, true, false); save(); sfx.ok();
  let msg = praise(t);
  if (m.justMastered) { run.mastered.push(t.concept); sfx.master(); msg = `${pick(XK.MASTERED)} «${CONCEPTS[t.concept].title}»`; }
  if (t.type === 'predict') { run.choice = run.lastChoice; run.phase = 'reveal'; renderPlay(); toast(msg, 'ok', 1400); return; }
  run.lock = true; markRight(); toast(msg, 'ok', m.justMastered ? 1800 : 900);
  setTimeout(() => { run.lock = false; if (run) afterTask(); }, m.justMastered ? 950 : 650);
}
function afterTask() {
  const L = run.lvl;
  if (L.boss) {
    run.qi++;
    if (run.qi >= run.queue.length) return bossWin();
    return setTask(run.queue[run.qi]);
  }
  nextTask();
}
function markRight() {
  const pr = document.querySelector('.prog i');
  if (pr && !run.lvl.boss) pr.style.width = GM.progress(S.mastery, run.lvl.concepts) * 100 + '%';
  if (pr && run.lvl.boss) pr.style.width = ((run.qi + 1) / run.queue.length) * 100 + '%';
  const a = document.getElementById('ans'); if (a) a.classList.add('right');
  const f = document.getElementById('fig'); if (f) f.classList.add('right');
}
function onBad(t, r, input) {
  run.streak = 0; run.bad++;
  const trapHit = !!(t.traps && (t.type === 'num' || t.type === 'tap' || t.type === 'name')) && r.msg !== t.explain[0] && !/Не сходится/.test(r.msg);
  const m = rec(t, false, trapHit);
  if (run.lvl.boss) run.hearts--;
  save(); sfx.bad();
  const meme = t.type === 'num' && run.input === '67';
  const title = meme ? 'Сикс-севен 🤷 Мем засчитан, ответ — нет' : trapHit ? pick(XK.OOPS_TRAP) : pick(XK.OOPS);
  const steps = (t.explain || []).map(s => `<li>${h(s)}</li>`).join('');
  const L = run.lvl;
  const forms = FORMS[t.concept].filter(f => f !== t.form);
  const after = L.boss ? (run.hearts > 0 ? `Осталось: ${'❤️'.repeat(run.hearts)}` : 'Сердечки кончились 💔')
    : t.type === 'predict' ? 'Сейчас покажу на чертеже, как на самом деле.'
    : forms.length ? `Серия по теме «${CONCEPTS[t.concept].title}» начинается заново. Спрошу это же по-другому: ${GC.FORMS_RU[forms[0]] || ''}.` : '';
  if (m.lost) toast(`Тема «${CONCEPTS[t.concept].title}» снова в работе`, 'warn', 2200);
  showSheet(`<div class="fb bad"><h3>${esc(title)}</h3><p>${h(r.msg)}</p>${steps ? `<div class="how">Как правильно</div><ol class="steps">${steps}</ol>` : ''}${after ? `<div class="hl">${esc(after)}</div>` : ''}<button class="btn big" data-act="afterBad">Понятно</button></div>`);
}
function afterBad() {
  hideSheet();
  const L = run.lvl, t = curTask();
  if (L.boss && run.hearts <= 0) return bossFail();
  if (t.type === 'predict') { run.choice = run.lastChoice; run.phase = 'reveal'; renderPlay(); return; }
  afterTask();
}
function revealDone() {
  if (!run || run.phase !== 'reveal') return;
  const t = curTask();
  toast(t.reveal.done, 'ok', 3200);
  run.phase = 'ask'; run.lock = true;
  setTimeout(() => { run.lock = false; if (run) afterTask(); }, 300);
}

/* ---------- финалы уровня ---------- */
function levelWin() {
  const L = run.lvl, l = lv(L.id), first = !l.done;
  l.done = true; l.doneAt = l.doneAt || Date.now(); save();
  const st = { ok: run.ok, bad: run.bad, best: run.best, mastered: run.mastered.slice() };
  run = null; lastAct = 0;
  sfx.win(); confetti();
  const cat = XK.CATS[L.id], nx = nextLevel();
  render(`<div class="center day${L.day}">
    <div class="burst">${XK.catSVG(cat, { size: 170 })}</div>
    <div class="kicker">${first ? 'Котик спасён!' : 'Пройдено ещё раз'}</div>
    <h1>${esc(cat.name)}</h1>
    <p class="power">${esc(cat.power)}</p>
    <div class="stats"><div><b>${st.ok}</b><span>верно</span></div><div><b>${st.bad}</b><span>${plural(st.bad, ['ошибка', 'ошибки', 'ошибок'])}</span></div><div><b>${st.best}</b><span>лучшая серия</span></div></div>
    ${st.mastered.length ? `<div class="daydone">Усвоено: ${st.mastered.map(c => '«' + esc(CONCEPTS[c].title) + '»').join(', ')} 🔒</div>` : ''}
    ${L.boss ? `<div class="daydone">Миссия ${L.day} пройдена! 🎉 ${L.day < 5 ? 'Можно продолжить сейчас — или завтра на свежую голову.' : ''}</div>` : ''}
    ${nx ? `<button class="btn big day${nx.day}" data-act="intro" data-id="${nx.id}">Дальше: ${esc(nx.title)}</button>` : ''}
    <button class="btn ghost" data-act="home">На карту</button>
  </div>`, 'scr-saved day' + L.day);
}
function bossWin() {
  const L = run.lvl;
  if (!L.final) return levelWin();
  const l = lv(L.id); l.done = true; l.doneAt = Date.now(); S.prizeAt = S.prizeAt || Date.now(); save();
  run = null; lastAct = 0;
  scrPrize(true);
}
function bossFail() {
  const L = run.lvl; save(); run = null; lastAct = 0;
  render(`<div class="center day${L.day}">
    <div class="burst">${XK.catSVG({ ...XK.GUIDE, eyes: 'sleepy' }, { size: 140 })}</div>
    <h1>Сердечки кончились</h1>
    <p class="power">Ластик стёр одно сердечко лишнее. Бывает. Босса редко проходят с первой попытки — в следующий раз задания будут другие.</p>
    <button class="btn big" data-act="play" data-id="${L.id}">Ещё раз</button>
    <button class="btn ghost" data-act="cheat">Посмотреть шпаргалку</button>
    <button class="btn ghost" data-act="home">На карту</button>
  </div>`, 'scr-fail day' + L.day);
}

/* ---------- приз ---------- */
function prizeText() {

async function share(text, title) {
  try { if (navigator.share) { await navigator.share({ title, text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Скопировано — вставь маме в чат', 'ok'); return; } catch (e) { /* покажем текст */ }
  showSheet(`<div class="fb"><h3>Скопируй и отправь</h3><textarea style="width:100%;min-height:200px;font:inherit;background:var(--bg2);color:var(--ink);border-radius:12px;padding:10px">${esc(text)}</textarea><button class="btn" data-act="stay">Готово</button></div>`, { dismiss: true });
}

/* ---------- для мамы ---------- */
function conceptState(c) {
  const m = S.mastery[c];
  if (!m || (!m.ok && !m.bad)) return 'none';
  return m.mastered ? 'done' : 'work';
}
function stats() {
  const allMs = Object.values(S.time).reduce((a, b) => a + b, 0);
  const allC = Object.keys(CONCEPTS);
  return { done: savedCount(), today: mins(S.time[today()] || 0), all: mins(allMs), mastered: masteredCount(allC), total: allC.length };
}
function reportText() {
  const s = stats();
  const lines = [`Гео-квест — отчёт ${NAME} (${new Date().toLocaleDateString('ru-RU')})`, `Пройдено уровней: ${s.done} из ${LEVELS.length}; тем усвоено: ${s.mastered} из ${s.total}`,
    `Время: сегодня ${s.today} мин, всего ${s.all} мин`, `Верных ответов: ${S.solved}, лучшая серия: ${S.bestStreak}`, ''];
  DAYS.forEach(d => {
    lines.push(`Миссия ${d.n}. ${d.title}:`);
    const ids = [...new Set(LEVELS.filter(l => l.day === d.n && !l.boss).flatMap(l => l.concepts))];
    ids.forEach(c => { const m = S.mastery[c] || { ok: 0, bad: 0 }; const st = conceptState(c); lines.push(`  ${st === 'done' ? '✓' : st === 'work' ? '…' : '○'} ${CONCEPTS[c].title} — ${m.ok} верно / ${m.bad} ошибок${S.traps[c] ? `, ловушек: ${S.traps[c]}` : ''}`); });
  });
  if (S.prizeAt) lines.push('', 'Заявка на приз:', prizeText());
  return lines.join('\n');
}
function scrMom() {
  const s = stats();
  const groups = DAYS.map(d => {
    const ids = [...new Set(LEVELS.filter(l => l.day === d.n && !l.boss).flatMap(l => l.concepts))];
    return `<h4>Миссия ${d.n}. ${esc(d.title)}</h4><ul class="tags">${ids.map(c => {
      const m = S.mastery[c] || { ok: 0, bad: 0, streak: 0 }, st = conceptState(c), all = m.ok + m.bad, pc = all ? Math.round((m.ok / all) * 100) : 0;
      const label = st === 'done' ? 'усвоено' : st === 'work' ? `в работе · серия ${m.streak}/${GM.NEED}` : 'не начато';
      return `<li class="st-${st}"><div class="tg"><span>${esc(CONCEPTS[c].title)}</span><b>${label}</b></div>${all ? `<div class="bar2"><i class="${pc < 60 ? 'low' : pc < 80 ? 'mid' : ''}" style="width:${pc}%"></i></div><div class="tgn">верно ${m.ok} из ${all}${S.traps[c] ? ` · попалась в ловушку: ${S.traps[c]}` : ''}${CONCEPTS[c].trapTitle ? ` · ловушка темы: ${esc(CONCEPTS[c].trapTitle)}` : ''}</div>` : ''}</li>`;
    }).join('')}</ul>`;
  }).join('');
  const lvs = DAYS.map(d => `<ul class="lv">${LEVELS.filter(l => l.day === d.n).map(l => { const x = S.levels[l.id]; return `<li class="${x && x.done ? 'ok' : ''}"><span>${x && x.done ? '✓' : '○'} ${esc(l.title)}</span><span class="n">${x ? `${x.ok} ✓ · ${x.bad} ✗` : '—'}</span></li>`; }).join('')}</ul>`).join('');
  const days = Object.keys(S.time).sort().map(k => `<li>${k.split('-').reverse().join('.')}: ${mins(S.time[k])} мин</li>`).join('');
  render(`<div class="mom">${bar('Для мамы')}
    <div class="kpi"><div><b>${s.mastered}/${s.total}</b><span>тем усвоено</span></div><div><b>${s.today}</b><span>мин сегодня</span></div><div><b>${s.all}</b><span>мин всего</span></div></div>
    <p class="sub">Уровней: ${s.done} из ${LEVELS.length} · верных ответов: ${S.solved} · лучшая серия: ${S.bestStreak}</p>
    <p class="sub">«Усвоено» = три верных подряд минимум двумя разными способами. Ошибка возвращает тему в работу.</p>
    <h3>Темы</h3>${groups}
    <h3>Уровни</h3>${lvs}
    ${days ? `<h3>По дням</h3><ul class="days">${days}</ul>` : ''}
    ${S.prizeAt ? `<h3>Заявка на приз</h3><div class="order">${esc(prizeText())}</div>` : ''}
    <button class="btn big" data-act="shareReport">Отправить отчёт</button>
    <details class="pinbox"><summary>Если прогресс сбился</summary>
      <p class="sub">Мамин код откроет уровни до выбранной миссии.</p>
      <input id="pin" inputmode="numeric" maxlength="4" placeholder="Код" autocomplete="off">
      <div class="two"><button class="btn ghost" data-act="unlock" data-day="1">Открыть миссию 2</button><button class="btn ghost" data-act="unlock" data-day="2">Открыть миссию 3</button></div>
      <div class="two"><button class="btn ghost" data-act="unlock" data-day="3">Открыть миссию 4</button><button class="btn ghost" data-act="unlock" data-day="4">Открыть миссию 5</button></div>
      <button class="btn ghost danger" data-act="resetAll">Стереть весь прогресс</button>
    </details>
  </div>`, 'scr-mom');
}
const pinOK = () => { const el = document.getElementById('pin'); if (el && el.value === MOM_PIN) return true; toast('Неверный код'); return false; };

/* ================= СОБЫТИЯ ================= */
const ACT = {
  startGame() { S.onboarded = true; save(); sfx.meow(); scrHome(); },
  home() { hideSheet(); scrHome(); },
  intro(d) { hideSheet(); scrIntro(d.id); },
  locked() { sfx.warn(); toast('Сначала пройди уровень перед ним — котиков спасаем по очереди'); },
  catLocked() { sfx.warn(); toast('Этого котика ещё надо спасти'); },
  play(d) { hideSheet(); startLevel(d.id); },
  key(d) {
    if (!run || run.lock || sheetOpen()) return;
    const t = curTask();
    if (t.type === 'name') { if (d.k === 'back') run.tiles.pop(); sfx.tap(); updateField(); renderTiles(); return; }
    if (d.k === 'back') run.input = run.input.slice(0, -1);
    else if (run.input.length < 7 && !(d.k === ',' && (run.input.includes(',') || !run.input))) run.input += d.k;
    sfx.tap(); updateField();
  },
  tile(d) {
    if (!run || run.lock || sheetOpen()) return;
    const i = +d.i; if (run.tiles.includes(i)) return;
    run.tiles.push(i); sfx.tap(); updateField(); renderTiles();
  },
  submit() { if (run) submit(); },
  choice(d) { if (!run) return; run.lastChoice = +d.i; submit({ choice: +d.i }); },
  errline(d) { submit({ line: +d.i }); },
  afterBad() { if (run) afterBad(); },
  revealDone() { revealDone(); },
  quit() {
    if (!run) return scrHome();
    showSheet(`<div class="fb"><h3>Выйти из уровня?</h3><p>${run.lvl.boss ? 'Босса потом придётся начать заново.' : 'Усвоенные темы сохранятся, недоделанные — продолжишь потом.'}</p><div class="two"><button class="btn ghost" data-act="stay">Остаться</button><button class="btn" data-act="home">Выйти</button></div></div>`, { dismiss: true });
  },
  stay() { hideSheet(); },
  sound() { S.sound = !S.sound; save(); scrHome(); },
  cats() { scrCats(); },
  cheat() { scrCheat(); },
  mom() { scrMom(); },
  prize() { scrPrize(false); },
  catInfo(d) { const c = XK.CATS[d.id]; sfx.meow(); showSheet(`<div class="fb catinfo">${XK.catSVG(c, { size: 150 })}<h3>${esc(c.name)}</h3><p>${esc(c.power)}</p><button class="btn" data-act="stay">Мяу</button></div>`, { dismiss: true }); },
  sharePrize() { share(`Мама, я прошла Гео-квест! 🐱 Спасла всех 25 котиков и стёрла Ластика.\n\nЗаявка на приз:\n${prizeText()}`, 'Заявка на приз'); },
  shareReport() { share(reportText(), 'Гео-квест — отчёт'); },
  unlock(d) {
    if (!pinOK()) return;
    LEVELS.forEach(l => { if (l.day <= +d.day) { lv(l.id).done = true; } }); save();
    toast('Готово: миссия ' + (+d.day + 1) + ' открыта', 'ok'); scrMom();
  },
  resetAll() {
    if (!pinOK()) return;
    showSheet(`<div class="fb"><h3>Стереть весь прогресс?</h3><p>Все котики и статистика пропадут. Вернуть будет нельзя.</p><div class="two"><button class="btn ghost" data-act="stay">Нет</button><button class="btn" data-act="resetYes">Стереть</button></div></div>`, { dismiss: true });
  },
  resetYes() { S = fresh(); save(); hideSheet(); scrOnboard(); },
};
function renderTiles() { const f = document.querySelector('.foot'); if (f && run) f.innerHTML = footHTML(curTask()); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');

  if (f) { e.preventDefault(); f(el.dataset, el); }
});
$scrim.addEventListener('click', () => { if ($scrim.dataset.dismiss) hideSheet(); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (sheetOpen()) {
    if (e.key === 'Enter' || e.key === 'Escape') { const b = $sheet.querySelector('.btn[data-act]'); if (b && e.key === 'Enter') b.click(); else if ($scrim.dataset.dismiss) hideSheet(); e.preventDefault(); }
    return;
  }
  if (!run || run.lock) return;
  const t = curTask(), k = e.key;
  if (t.type === 'num') {
    if (/^[0-9]$/.test(k) || k === ',' || k === '.') ACT.key({ k: k === '.' ? ',' : k });
    else if (k === 'Backspace') ACT.key({ k: 'back' });
    else if (k === 'Enter') ACT.submit();
    else return;
    e.preventDefault();
  } else if (k === 'Enter') { ACT.submit(); e.preventDefault(); }
});


/* офлайн: только на настоящем сайте (https), не на локальном сервере */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

if (!S.onboarded) scrOnboard(); else scrHome();
})();

</script>
