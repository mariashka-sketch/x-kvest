<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Икс-квест">
<meta name="theme-color" content="#0f0b17">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Икс-квест: алгебра за три дня — минус, уравнения, задачи. И котики.">
<title>Икс-квест</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Икс-квест — оформление. Тёмная тема, крупные формулы, клавиатура под большой палец. */
:root {
  --bg: #0f0b17; --bg2: #160f23; --card: #1d1531; --card2: #271d3f; --line: #362a54;
  --ink: #f8f5ff; --mute: #cdc4e2; --dim: #9a8fb6;
  --pink: #ff4f8b; --blue: #4aa8ff; --lime: #b8f04a; --gold: #ffcf4a; --okc: #3fe08f; --badc: #ff6070;
  --acc: var(--pink); --acc-ink: #1a0f22; --minus: #ff4f8b;
}
.day1 { --acc: var(--pink); }
.day2 { --acc: var(--blue); }
.day3 { --acc: var(--lime); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink);
  background: radial-gradient(120% 55% at 50% -12%, #2c1749 0%, var(--bg) 62%) fixed var(--bg);
  font: 20px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
#app {
  max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 18px);
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
h1 { font-size: 38px; line-height: 1.08; margin: 8px 0 10px; letter-spacing: -.02em; }
h2 { font-size: 27px; line-height: 1.15; margin: 4px 0 4px; letter-spacing: -.01em; }
h3 { font-size: 23px; margin: 20px 0 8px; }
h4 { font-size: 19px; margin: 14px 0 6px; color: var(--mute); }
p { margin: 8px 0; }
.sub { color: var(--mute); font-size: 18px; }

/* ---------- формулы ---------- */
.m, .math, .tile, .ans, .errl, .ln, .ex, .tbl td { font-variant-numeric: tabular-nums lining-nums; }
.m i, .math i, .ans i, .tile i, .errl i, .ln i, .k i, .tbl i, .ex i, .opt i, .tilebtn i {
  font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic; font-weight: 600; padding: 0 .04em;
}
.mn { color: var(--minus); font-weight: 900; }
.nw { white-space: nowrap; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .68em; line-height: 1.08; margin: 0 .12em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .2em .05em; }
.fr > span:last-child { padding-top: .05em; }
.m { font-weight: 700; }

/* ---------- кнопки ---------- */
.btn {
  display: block; width: 100%; padding: 16px 18px; margin-top: 12px; border-radius: 18px;
  background: var(--acc); color: var(--acc-ink); font-weight: 800; font-size: 21px; text-align: center;
  box-shadow: 0 10px 26px -12px var(--acc);
}
.btn.big { font-size: 23px; padding: 19px; }
.btn.ghost { background: var(--card2); color: var(--ink); box-shadow: none; }
.btn.danger { color: var(--badc); }
.btn:active, .opt:active, .node:active, .tile:active, .errl:active, .catcard:active { transform: scale(.97); }
.ico { width: 44px; height: 44px; border-radius: 14px; background: var(--card); font-size: 24px; display: grid; place-items: center; }

/* ---------- шапка и шкала ---------- */
.bar { display: grid; grid-template-columns: 44px 1fr 76px; align-items: center; gap: 8px; min-height: 48px; }
.bar .ttl { text-align: center; font-weight: 800; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .meta { text-align: right; font-weight: 800; font-size: 19px; color: var(--mute); white-space: nowrap; }
.hearts { font-size: 17px; letter-spacing: -1px; }
.prog { height: 10px; border-radius: 99px; background: var(--card2); margin: 6px 0 10px; overflow: hidden; flex: none; }
.prog i { display: block; height: 100%; border-radius: 99px; background: var(--acc); transition: width .45s cubic-bezier(.2, .9, .3, 1.2); }

/* ---------- экран задачи ---------- */
#app.scr-play { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
.stage { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding: 2px 0 10px; }
.task { background: var(--card); border-radius: 22px; padding: 16px; margin-top: auto; flex: none; }
.task.big { margin: auto 0; padding: 20px 16px; }
.lead { color: var(--mute); font-size: 19px; font-weight: 600; }
.lead.story-lead { color: var(--ink); font-size: 22px; line-height: 1.38; }
.task.big .lead { font-size: 21px; }
.math { font-size: 40px; font-weight: 700; line-height: 1.25; margin: 6px 0 12px; letter-spacing: -.01em; }
.task.big .math { font-size: 50px; }
.math.rows { text-align: center; line-height: 1.15; }
.math .qm { display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 12px; border: 2px dashed var(--acc); color: var(--acc); font-size: .8em; }
.tip { font-size: 17px; color: var(--gold); margin: 2px 0 10px; }
.ans {
  display: flex; align-items: center; gap: 8px; min-height: 66px; padding: 8px 14px; border-radius: 16px;
  background: var(--bg2); border: 2px solid var(--line); font-size: 38px; font-weight: 700; transition: border-color .2s, background .2s;
}
.ans .pre { color: var(--mute); }
.ans .ph { color: var(--dim); }
.ans .val { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.ans { flex-wrap: wrap; row-gap: 2px; }
.caret { display: inline-block; vertical-align: -.14em; margin-left: 5px; width: 3px; height: 1.05em; background: var(--acc); border-radius: 2px; animation: blink 1s steps(1) infinite; }
.ans.right { border-color: var(--okc); background: rgba(63, 224, 143, .13); }
.ans.right .caret { display: none; }
@keyframes blink { 50% { opacity: 0; } }
.hintbtn { margin-top: 12px; font-size: 18px; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; }

.story { background: var(--card); border-radius: 18px; padding: 14px 16px; font-size: 20px; line-height: 1.42; flex: none; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 21px; flex: none; }
.tbl th { font-size: 16px; color: var(--mute); font-weight: 700; text-align: left; padding: 2px 4px; }
.tbl thead th { text-align: center; }
.tbl td { background: var(--card); border-radius: 10px; padding: 9px 6px; text-align: center; font-weight: 700; }
.tbl td.cur { box-shadow: inset 0 0 0 2px var(--acc); }
.tbl .q { color: var(--dim); }
.grid-paper, .note, .ex {
  background-color: var(--bg2);
  background-image: linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
  background-size: 18px 18px;
}
.note { border-radius: 16px; padding: 10px 14px; font-size: 26px; font-weight: 700; flex: none; }
.note .ln { padding: 3px 0; }
.note .ln.new { animation: pop .5s cubic-bezier(.2, .9, .3, 1.4); color: var(--acc); }
@keyframes pop { 0% { transform: translateY(8px) scale(.94); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* клавиатура */
.foot { flex: none; }
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.sp { padding: 12px 6px; border-radius: 14px; background: var(--card2); font-weight: 800; font-size: 19px; border: 2px dashed var(--line); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.k {
  height: 56px; border-radius: 15px; background: var(--card2); font-size: 31px; font-weight: 700;
  display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .28);
}
.k:active { transform: translateY(1px) scale(.97); filter: brightness(1.3); }
.k.op { background: #2c2147; color: var(--mute); }
.k.var { color: var(--acc); font-size: 35px; }
.k.ok { background: var(--acc); color: var(--acc-ink); font-size: 23px; font-weight: 900; }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; } .span4 { grid-column: span 4; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { padding: 15px 16px; border-radius: 16px; background: var(--card2); text-align: left; font-size: 21px; font-weight: 700; border: 2px solid var(--line); }
.opt .m { font-size: 26px; }
.opts.cmp { flex-direction: row; }
.opts.cmp .opt { flex: 1; text-align: center; font-size: 40px; }
.opts.cmp .opt .m { font-size: inherit; }
.foot-hint { color: var(--mute); text-align: center; font-size: 18px; padding: 10px 0 6px; }

/* плитки «перенос через =» */
.tiles { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 12px 0 4px; }
.side { display: flex; flex-wrap: wrap; align-content: center; gap: 6px; min-height: 62px; padding: 8px; border-radius: 16px; background: var(--bg2); }
.sl { justify-content: flex-end; } .sr { justify-content: flex-start; }
.eqs { font-size: 40px; font-weight: 900; color: var(--mute); }
.tile { padding: 9px 11px; border-radius: 13px; font-size: 27px; font-weight: 800; background: var(--card2); border: 2px solid var(--line); min-width: 52px; }
.tile.tv { border-color: rgba(74, 168, 255, .55); }
.tile.moved { animation: flip .6s cubic-bezier(.2, .9, .3, 1.3); border-color: var(--acc); }
@keyframes flip { 0% { transform: rotateY(90deg) scale(.6); opacity: .2; } 100% { transform: none; opacity: 1; } }
.tilebtn { font-size: 40px !important; }

/* найди ошибку */
.errs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.errl { text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--bg2); border: 2px solid var(--line); font-size: 26px; font-weight: 700; }

/* ---------- шторка, тост, конфетти ---------- */
#scrim { position: fixed; inset: 0; background: rgba(6, 3, 12, .6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
#scrim.on { opacity: 1; pointer-events: auto; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; display: flex; justify-content: center; pointer-events: none; }
#sheet .in {
  pointer-events: auto; width: 100%; max-width: 520px; max-height: 84vh; max-height: 84dvh; overflow: auto;
  background: var(--card); border-radius: 26px 26px 0 0; padding: 22px 18px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .9, .3, 1.05); box-shadow: 0 -12px 40px rgba(0, 0, 0, .5);
}
#sheet.on .in { transform: none; }
#sheet:not(.on) .in { visibility: hidden; transition: transform .3s, visibility 0s .3s; }
.fb h3 { margin: 0 0 6px; font-size: 27px; }
.fb.bad h3 { color: var(--badc); }
.fb.good h3 { color: var(--okc); }
.fb p { font-size: 21px; }
.fb .q { font-size: 22px; font-weight: 600; }
.fb-cat { float: right; margin: -6px -4px 0 8px; }
.how { margin-top: 14px; color: var(--mute); font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .07em; }
.steps { margin: 6px 0 4px; padding-left: 26px; font-size: 22px; }
.steps li { margin: 7px 0; }
.hl { margin-top: 12px; font-weight: 700; color: var(--mute); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.two .btn { margin: 0; }
.catinfo { text-align: center; }
#toast { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 62px); display: flex; justify-content: center; pointer-events: none; z-index: 60; padding: 0 16px; }
#toast .t { max-width: 480px; padding: 12px 16px; border-radius: 16px; font-weight: 700; font-size: 19px; background: var(--card2); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transform: translateY(-14px); opacity: 0; transition: transform .22s, opacity .22s; }
#toast.on .t { transform: none; opacity: 1; }
#toast .t.ok { background: #15402e; color: #b5f7d3; }
#toast .t.warn { background: #3d3112; color: #ffe39a; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; display: none; }

/* ---------- карта ---------- */
.top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.logo { font-size: 32px; font-weight: 900; letter-spacing: -.03em; }
.logo span { color: var(--pink); }
.hi, .says { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.says { align-items: flex-start; margin: 6px 0 14px; }
.cat { flex: none; display: block; }
.bubble { position: relative; flex: 1; background: var(--card); padding: 11px 14px; border-radius: 16px; font-weight: 600; font-size: 19px; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 18px; border: 8px solid transparent; border-right-color: var(--card); border-left: 0; }
.prize-bar { background: var(--card); border-radius: 18px; padding: 12px 14px; margin: 8px 0 4px; }
.pb-t { display: flex; justify-content: space-between; font-size: 18px; color: var(--mute); }
.pb-t b { color: var(--ink); }
.pb { height: 10px; border-radius: 99px; background: var(--bg2); margin: 8px 0 6px; overflow: hidden; }
.pb i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--blue), var(--lime)); border-radius: 99px; }
.pb-s { font-size: 16px; color: var(--dim); }
.go { margin-top: 12px; }
.day { margin-top: 16px; padding: 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; }
.day::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--acc); }
.day.locked { opacity: .5; }
.dhead { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--acc); }
.dok { color: var(--okc); }
.day p { color: var(--mute); font-size: 18px; margin: 2px 0 12px; }
.nodes { display: flex; flex-wrap: wrap; gap: 6px; }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 21px; background: var(--card2); border: 2px solid var(--line); }
.node.open { border-color: var(--acc); color: var(--acc); }
.node.cur { background: var(--acc); color: var(--acc-ink); animation: pulse 1.5s infinite; }
.node.done { background: var(--bg2); border-color: var(--acc); }
.node.boss { border-radius: 14px; font-size: 20px; }
.node.done svg { width: 38px; height: 38px; }
.node.lock { opacity: .55; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .35); } 70% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
.links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.links button { background: var(--card); border-radius: 16px; padding: 14px 4px; font-size: 16px; font-weight: 700; }

/* ---------- карточка уровня ---------- */
.kick { font-size: 15px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--acc); margin-top: 6px; }
.rules { display: flex; flex-direction: column; gap: 8px; }
.rule { background: var(--card); border-left: 4px solid var(--acc); border-radius: 14px; padding: 12px 14px; font-size: 21px; font-weight: 600; }
.ex { margin-top: 12px; border-radius: 16px; padding: 12px 14px; font-size: 26px; font-weight: 700; }
.ex-h { font-size: 15px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; font-weight: 800; }
.ex-l { opacity: 0; animation: fadeup .5s forwards; padding: 2px 0; }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.goal { margin-top: 14px; color: var(--mute); font-size: 18px; }
.reward { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 18px; color: var(--mute); }

/* ---------- финалы ---------- */
.center { text-align: center; padding-top: 10px; }
.burst { display: grid; place-items: center; margin: 6px auto 0; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .13) 0%, transparent 68%); animation: popin .7s cubic-bezier(.2, .9, .3, 1.5); }
@keyframes popin { from { transform: scale(.4) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
.kicker { font-size: 16px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--acc); }
.power { font-size: 21px; color: var(--mute); max-width: 380px; margin: 6px auto 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats div { background: var(--card); border-radius: 16px; padding: 12px 4px; }
.stats b { display: block; font-size: 32px; }
.stats span { font-size: 15px; color: var(--mute); }
.daydone { background: var(--card); border-radius: 16px; padding: 12px 14px; font-weight: 700; margin: 6px 0; }
.catrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin: 8px 0 14px; }
.prizebox { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: linear-gradient(135deg, rgba(255, 79, 139, .2), rgba(74, 168, 255, .16)); border: 1px solid var(--line); border-radius: 18px; padding: 14px; font-size: 19px; margin: 12px 0; }
.prizebox > span { font-size: 30px; line-height: 1; }
.tipbox { background: #2d2610; color: #ffe39a; border-radius: 16px; padding: 12px 14px; font-size: 18px; text-align: left; margin: 10px 0; }
.form label { display: block; text-align: left; font-size: 17px; color: var(--mute); font-weight: 700; margin-top: 12px; }
.form input, .form textarea, .pinbox input {
  display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg2); color: var(--ink); font: inherit; font-size: 20px; resize: vertical;
}
.villain { vertical-align: middle; }

/* ---------- коллекция, шпаргалка, мама ---------- */
.catgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.catcard { background: var(--card); border-radius: 18px; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 17px; }
.catcard svg { width: 76px; height: 76px; }
.catcard.lock b { color: var(--dim); }
.cs { background: var(--card); border-radius: 18px; padding: 14px 16px; margin-top: 12px; border-left: 4px solid var(--acc); }
.cs h3 { margin: 0 0 6px; font-size: 21px; }
.cs p { font-size: 19px; margin: 6px 0; }
.csx { margin-top: 8px; padding: 8px 12px; border-radius: 12px; font-size: 22px; font-weight: 700; background: var(--bg2); }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.kpi div { background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center; }
.kpi b { display: block; font-size: 30px; }
.kpi span { font-size: 15px; color: var(--mute); }
.tags, .lv, .days { list-style: none; padding: 0; margin: 0; }
.tags li { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-top: 8px; }
.tg { display: flex; justify-content: space-between; gap: 8px; font-size: 18px; font-weight: 700; }
.bar2 { height: 8px; border-radius: 99px; background: var(--bg2); margin: 8px 0 4px; overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--okc); border-radius: 99px; }
.bar2 i.mid { background: var(--gold); } .bar2 i.low { background: var(--badc); }
.tgn { font-size: 15px; color: var(--mute); }
.lv li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 18px; }
.lv li.ok { color: var(--ink); } .lv li:not(.ok) { color: var(--mute); }
.lv .n { color: var(--mute); white-space: nowrap; }
.days li { padding: 4px 0; color: var(--mute); }
.pinbox { margin-top: 18px; background: var(--card); border-radius: 16px; padding: 12px 14px; }
.pinbox summary { font-weight: 700; color: var(--mute); }
.order { background: var(--card); border-radius: 16px; padding: 12px 14px; white-space: pre-wrap; font-size: 18px; }

@media (max-height: 720px) {
  .k { height: 50px; font-size: 28px; }
  .math { font-size: 34px; margin-bottom: 8px; }
  .task.big .math { font-size: 42px; }
  .ans { min-height: 58px; font-size: 32px; }
  .note { font-size: 22px; }
  .story { font-size: 19px; }
  .lead.story-lead { font-size: 20px; }
}
@media (max-height: 690px) {
  .k { height: 45px; font-size: 27px; }
  .pad { gap: 6px; }
  .spec { margin-bottom: 6px; }
  .sp { padding: 8px 6px; }
  .task, .task.big { padding: 12px 14px; }

/* Икс-квест — математика: точные дроби, линейные выражения, разбор ввода, вёрстка формул.

<script>
/* Икс-квест — задачи, подсказки, проверка ответов.
   Учебник: Макарычев, Алгебра 7, §3 (п. 8 «Линейное уравнение», п. 9 «Задачи с помощью уравнений»).
   День 1 построен на её контрольной от 14.10: почти все ошибки там — потерянный минус. */
(function (root) {
'use strict';

/* ---------- случайность ---------- */
const rnd = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],

  p: x => Math.random() < x,

      m(`${fmtPieces([p])} = ${fmtTerms(res)}`)];

/* ----- уравнения ----- */
const mkEq = (v, L, R) => ({ v, L, R });
const fmtEq = eq => fmtPieces(eq.L) + ' = ' + fmtPieces(eq.R);
const hasBr = ps => ps.some(p => p.t === 'br');
function solveEq(eq) {
  const l = linOf(eq.L), r = linOf(eq.R);
  const A = l.coef(eq.v).sub(r.coef(eq.v)), Bc = r.c.sub(l.c);
  if (A.isZero()) return { A, B: Bc, sol: Bc.isZero() ? 'any' : 'none' };
  return { A, B: Bc, sol: Bc.div(A) };
}
function moved(eq) {
  const Lt = expandPieces(eq.L), Rt = expandPieces(eq.R);
  const neg = t => ({ v: t.v, c: t.c.neg() });
  return { Lt, Rt, left: Lt.filter(t => t.v).concat(Rt.filter(t => t.v).map(neg)), right: Rt.filter(t => !t.v).concat(Lt.filter(t => !t.v).map(neg)) };
}
const axbStr = (v, A, Bc) => `${fmtTerms([{ v, c: A }])} = ${fmtNum(Bc)}`;
function finalSteps(eq) {
  const { A, B: Bc, sol } = solveEq(eq);
  if (sol === 'none') return [`Ноль умножить на любое число — ноль, а справа ${m(fmtNum(Bc))}. Так не бывает → корней нет.`];
  if (sol === 'any') return [`${m('0 * ' + eq.v + ' = 0')} — верно при любом ${m(eq.v)} → корень — любое число.`];
  return [m(`${eq.v} = ${fmtNum(Bc)} : ${fmtPar(A)} = ${fmtNum(sol)}`)];
}
function finalLine(eq) {
  const { sol } = solveEq(eq);
  return sol === 'none' ? 'Корней нет' : sol === 'any' ? `${m(eq.v)} — любое число` : m(`${eq.v} = ${fmtNum(sol)}`);
}
/* Решение целиком, как в учебнике на с. 35 */
function eqLines(eq) {
  const { A, B: Bc } = solveEq(eq);
  const mv = moved(eq);
  const out = [m(fmtEq(eq))];
  if (hasBr(eq.L) || hasBr(eq.R)) out.push(m(`${fmtTerms(mv.Lt)} = ${fmtTerms(mv.Rt)}`));
  const ml = m(`${fmtTerms(mv.left)} = ${fmtTerms(mv.right)}`);
  if (ml !== out[out.length - 1]) out.push(ml);
  const ab = m(axbStr(eq.v, A, Bc));
  if (ab !== out[out.length - 1]) out.push(ab);
  if (!A.eq(1)) out.push(finalLine(eq));

}
/* Пошаговый режим: скобки → перенос плитками → подобные → x */

  const brs = [...eq.L, ...eq.R].filter(p => p.t === 'br');
  brs.forEach((p, i) => {
    const res = expandPieces([p]);
    st.push(exprTask({
      lead: 'Раскрой скобки:', math: fmtPieces([p]), answer: Lin.ofTerms(res), vars: [eq.v], order: orderOf(res), tag: 'br',
      steps: bracketSteps(p), line: i === brs.length - 1 ? m(`${fmtTerms(mv.Lt)} = ${fmtTerms(mv.Rt)}`) : null,
    }));

  }

  if (needL) st.push(exprTask({
    lead: 'Приведи подобные слева:', math: fmtTerms(mv.left), answer: new Lin({ [eq.v]: A }), vars: [eq.v], tag: 'like', zeroOk: true,
    steps: likeSteps(mv.left), line: needR ? null : ab,

    steps: likeSteps(mv.right), line: ab, signMsg: 'Число верное, а знак — нет.',
  }));
  if (!A.eq(1)) st.push(numTask({
    lead: A.isZero() ? 'Что получилось?' : `Найди ${m(eq.v)}:`, math: axbStr(eq.v, A, Bc), answer: sol, prefix: eq.v + ' =', special: special || A.isZero(),
    tag: A.isZero() ? 'zero' : 'div', steps: finalSteps(eq), line: finalLine(eq),
    tip: sol instanceof Q && !sol.isInt() && !nice(sol) ? 'Дробь набирай через /' : null,
    diag: val => (sol instanceof Q && !Bc.isZero() && val.eq(A.div(Bc)) ? `Делить надо наоборот: ${m(fmtNum(Bc) + ' : ' + fmtPar(A))}.` : null),
    signMsg: 'Число верное, а знак — нет. При делении знаки — как при умножении.',
  }));

function guidedEq(eq, opts) { return { eq, lines: [m(fmtEq(eq))], stages: eqStages(eq, opts) }; }
function freeEq(eq) {
  const { sol } = solveEq(eq);
  return {

/* Генераторы уравнений: корень выбираем заранее, потом подгоняем число справа */
function eqMove() {

    if (b) { if (form === 'f3') L.unshift(T('', b)); else L.push(T('', b)); }
    if (c) R.push(T(v, c));
    if (d) { if (form === 'f3' && R.length) R.unshift(T('', d)); else R.push(T('', d)); }
    if (!R.length) continue;

function genParts() {

  d.parts.forEach((p, i) => {

  });

  stages.push(exprTask({ lead: 'Сложи все части и упрости:', math: d.sumMath, answer: d.sum, vars: ['x'], tag: 'like',

/* ---------- проверка ответа ----------
   ok — верно; bad — ошибка (с пояснением); retry — не засчитываем ни туда ни сюда (не та запись, не досчитала). */
function check(task, input) {
  if (task.type === 'choice') {
    const o = task.options[input.choice];
    if (o.ok) return { ok: true };
    return o.soft ? { retry: true, msg: o.why } : { bad: true, msg: o.why || 'Не то.' };
  }
  if (task.type === 'finderr') {
    if (input.line === task.wrong) return { ok: true };
    return { bad: true, msg: input.line < task.wrong ? 'Эта строчка как раз верная. Ошибка появилась ниже.' : 'Ошибка появилась раньше — проверь строчки выше.' };
  }
  if (task.type === 'num') return checkNum(task, input);
  return checkExpr(task, input);
}
function checkNum(task, input) {
  const ans = task.answer;
  if (input && input.special) {
    if (input.special === ans) return { ok: true };
    if (ans === 'none') return { bad: true, msg: `Иксы сократились, а справа не ноль — корней нет.` };
    if (ans === 'any') return { bad: true, msg: `Иксы сократились, и справа тоже ноль — подходит любое число.` };
    return { bad: true, msg: 'Здесь есть корень — иксы не сокращаются.' };
  }
  const p = XM.parseInput(input);
  if (!p.ok) return { retry: true, msg: p.err };
  if (!p.lin.isConst()) return { retry: true, msg: 'Тут нужен ответ числом — без букв' };
  if (!(ans instanceof Q)) return { bad: true, msg: `Проверь: иксы здесь сокращаются.` };
  if (!p.reduced) return { retry: true, unfin: p.lin.c.eq(ans), msg: 'Досчитай до одного числа' };
  const val = p.lin.c;
  if (val.eq(ans)) return { ok: true };
  const d = task.diag && task.diag(val);
  if (d) return { bad: true, msg: d };
  if (!ans.isZero() && val.eq(ans.neg())) return { bad: true, sign: true, msg: task.signMsg || 'Число верное, а знак — нет.' };
  return { bad: true, msg: 'Не сходится. Смотри, как надо:' };
}
function checkExpr(task, input) {
  const p = XM.parseInput(input);
  if (!p.ok) return { retry: true, msg: p.err };
  const ans = task.answer, her = p.lin;
  const extra = her.vars().filter(v => !(task.vars || []).includes(v));
  if (extra.length) return { retry: true, msg: `Откуда тут ${m(extra[0])}? В задании другая буква.` };
  if (ans.isZero() && her.isZero()) return { ok: true };
  if (her.eq(ans)) {
    if (!p.reduced && !task.allowUnreduced) return { retry: true, unfin: true, msg: 'Почти! Это ещё не до конца — сложи подобные.' };
    return { ok: true };
  }
  for (const a of task.alts || []) if (her.eq(a.lin)) return { bad: true, msg: a.msg };
  const keys = [...new Set([...ans.vars(), ...her.vars(), ''])];
  const flipped = [];
  let other = false;
  for (const v of keys) {
    const c1 = ans.coef(v), c2 = her.coef(v);
    if (c1.eq(c2)) continue;
    if (!c1.isZero() && c2.eq(c1.neg())) flipped.push({ v, c: c1 }); else other = true;
  }
  if (flipped.length && !other) return { bad: true, sign: true, msg: `Всё верно, кроме знака: должно быть ${flipped.map(f => m(fmtSigned(f))).join(' и ')}.` };
  return { bad: true, msg: 'Не сходится. Смотри, как надо:' };
}

function startLevel(id) {
  const L = LEVELS[idx(id)], l = lv(id);
  run = { lvl: L, progress: 0, streak: 0, recent: [], ok: 0, bad: 0, best: 0, hearts: L.hearts || 0, lock: false, input: '' };
  lastAct = Date.now();
  if (L.boss) { run.queue = L.set(l.runs === 0); run.qi = 0; l.runs++; save(); prep(run.queue[0]); renderPlay(); return; }
  l.runs++; save();
  nextProblem();
}
const sig = p => (p.text || '') + (p.stages[0].lead || '') + (p.stages[0].math || '');
function prep(p) {
  run.problem = p; run.si = 0; run.pm = 0; run.input = ''; run.hinted = false; run.tiles = null; run.freshLine = false;
  run.notebook = (p.lines || []).slice(); run.table = p.table ? JSON.parse(JSON.stringify(p.table)) : null;
}
function nextProblem() {
  let p, tries = 0;
  do { p = run.lvl.gen(); tries++; } while (tries < 15 && run.recent.includes(sig(p)));
  run.recent.push(sig(p)); if (run.recent.length > 10) run.recent.shift();
  prep(p); renderPlay();
}
const curTask = () => run.problem.stages[run.si];

function renderPlay() {
  const L = run.lvl, p = run.problem, t = curTask();
  if (t.type === 'tiles' && !run.tiles) initTiles(t);
  const pct = L.boss ? (run.qi / run.queue.length) * 100 : Math.min(100, (run.progress / L.target) * 100);
  const meta = L.boss ? `<span class="hearts">${'❤️'.repeat(Math.max(0, run.hearts))}${'🤍'.repeat(L.hearts - Math.max(0, run.hearts))}</span>`
    : `${run.progress}/${L.target}`;
  const parts = [];
  if (p.text) parts.push(`<div class="story">${h(p.text)}</div>`);
  if (run.table) parts.push(tableHTML(run.table, t.cell));
  if (run.notebook.length) parts.push(`<div class="note">${run.notebook.map((l, i) => `<div class="ln${run.freshLine && i === run.notebook.length - 1 ? ' new' : ''}">${h(l)}</div>`).join('')}</div>`);
  parts.push(taskHTML(t, p));
  render(`${bar(L.boss ? `${L.short} · ${run.qi + 1} из ${run.queue.length}` : L.title, 'quit', meta)}
    <div class="prog"><i style="width:${pct}%"></i></div>
    <main class="stage" id="stage">${parts.join('')}</main>
    <footer class="foot">${footHTML(t)}</footer>`, `scr-play day${L.day}`);
  run.freshLine = false;
  const st = document.getElementById('stage'), task = st.querySelector('.task');
  if (task.offsetHeight <= st.clientHeight) st.scrollTop = st.scrollHeight;
  else st.scrollTop += task.getBoundingClientRect().top - st.getBoundingClientRect().top - 4;
}
function taskHTML(t, p) {
  const big = p.stages.length === 1 && !p.text && !p.free;
  if (t.type === 'tiles') {
    const { left, right } = tilesSides();
    return `<div class="task"><div class="lead">${h(t.lead)}</div><div class="tiles"><div class="side sl">${left.map(tileHTML).join('')}</div><div class="eqs">=</div><div class="side sr">${right.map(tileHTML).join('')}</div></div></div>`;
  }
  if (t.type === 'finderr') {
    return `<div class="task"><div class="lead">${h(t.lead)}</div><div class="errs">${t.lines.map((l, i) => `<button class="errl" data-act="errline" data-i="${i}">${mh(l)}</button>`).join('')}</div></div>`;
  }
  let s = `<div class="task${big || p.free ? ' big' : ''}">`;
  if (t.lead) s += `<div class="lead${!t.math && p.stages.length === 1 ? ' story-lead' : ''}">${h(t.lead)}</div>`;
  if (t.math) s += `<div class="math">${mh(t.math)}</div>`;
  if (t.mathRows) s += `<div class="math rows">${t.mathRows.map(r => `<div>${r === '?' ? '<span class="qm">?</span>' : mh(r)}</div>`).join('')}</div>`;
  if (t.tip) s += `<div class="tip">💡 ${h(t.tip)}</div>`;
  if (t.type === 'num' || t.type === 'expr') s += `<div class="ans" id="ans">${fieldHTML(t)}</div>`;
  if (p.free && !run.lvl.boss) s += `<button class="hintbtn" data-act="steps">Застряла? Шаги</button>`;
  return s + '</div>';
}
const spaced = raw => raw.replace(/(?!^)([+-])/g, ' $1 ').replace(/\s+/g, ' ').trim();
function fieldHTML(t) {
  const pre = t.prefix ? `<span class="pre">${mh(t.prefix)}</span>` : '';
  return `${pre}<span class="val">${run.input ? mh(spaced(run.input)) : '<span class="ph">?</span>'}<i class="caret"></i></span>`;
}
function updateField() { const a = document.getElementById('ans'); if (a) a.innerHTML = fieldHTML(curTask()); }
function tableHTML(tb, cur) {
  return `<table class="tbl"><thead><tr>${tb.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map((r, i) =>
    `<tr>${r.map((c, j) => (j === 0 ? `<th>${esc(c)}</th>` : `<td class="${cur && cur[0] === i && cur[1] === j ? 'cur' : ''}">${c ? h(c) : '<span class="q">?</span>'}</td>`)).join('')}</tr>`).join('')}</tbody></table>`;
}
function footHTML(t) {
  if (t.type === 'choice') return `<div class="opts${t.big ? ' cmp' : ''}">${t.options.map((o, i) => `<button class="opt" data-act="choice" data-i="${i}">${h(o.label)}</button>`).join('')}</div>`;
  if (t.type === 'tiles') return `<div class="foot-hint">Нажимай на плитку, которая стоит не на своей стороне</div>`;
  if (t.type === 'finderr') return `<div class="foot-hint">Нажми на строчку, где появилась ошибка</div>`;
  const vars = t.type === 'expr' ? (t.vars || []).slice(0, 2) : [];
  const k = (label, key, cls = '') => `<button class="k ${cls}" data-act="key" data-k="${key}">${label}</button>`;
  let g = t.special ? `<div class="spec"><button class="sp" data-act="special" data-v="none">Корней нет</button><button class="sp" data-act="special" data-v="any">Любое число</button></div>` : '';
  g += '<div class="pad">'
    + k('7', '7') + k('8', '8') + k('9', '9') + k('<span class="mn">−</span>', '-', 'op')
    + k('4', '4') + k('5', '5') + k('6', '6') + k('+', '+', 'op')
    + k('1', '1') + k('2', '2') + k('3', '3') + k('/', '/', 'op')
    + k(',', ',', 'op') + k('0', '0') + k('⌫', 'back', 'op' + (vars[0] ? '' : ' span2')) + (vars[0] ? k(`<i>${vars[0]}</i>`, vars[0], 'var') : '')
    + (vars[1] ? k(`<i>${vars[1]}</i>`, vars[1], 'var') : '') + `<button class="k ok ${vars[1] ? 'span3' : 'span4'}" data-act="submit">Проверить</button>`;
  return g + '</div>';
}

/* ---------- ответ ---------- */
function rec(tag, ok) {
  const t = (S.tags[tag] = S.tags[tag] || { ok: 0, bad: 0 }); ok ? t.ok++ : t.bad++;
  const l = lv(run.lvl.id); ok ? l.ok++ : l.bad++;
}
const MINUS_TAGS = ['mul', 'sub', 'br', 'move'];
function submit(input) {
  if (!run || run.lock || sheetOpen()) return;
  const t = curTask();
  if (typeof input === 'string' && !input) { sfx.warn(); return toast('Сначала введи ответ'); }
  tick();
  const r = check(t, input);
  if (r.retry) {
    if (r.unfin) { S.unfin++; save(); }
    sfx.warn();
    return toast(r.msg + (r.unfin ? ' Кот тоже не бросает миску на полпути 😼' : ''), 'warn', 3400);
  }
  if (r.ok) onOk(t); else onBad(t, r, input);
}
function praise(t) {
  if (XK.STREAK[run.streak]) return XK.STREAK[run.streak];
  return pick(MINUS_TAGS.includes(t.tag) && Math.random() < 0.5 ? XK.PRAISE_MINUS : XK.PRAISE);
}
function applyStage(t) {
  if (t.line) run.notebook.push(t.line);
  if (t.cell && run.table) {
    run.table.rows[t.cell[0]][t.cell[1]] = t.cellText ? '`' + t.cellText + '`' : t.answer instanceof XM.Lin ? '`' + t.answer.fmt(t.order || ['x', '']) + '`' : '';
  }
}
function onOk(t) {
  run.streak++; run.ok++; run.best = Math.max(run.best, run.streak); S.bestStreak = Math.max(S.bestStreak, run.streak);
  rec(t.tag, true); if (MINUS_TAGS.includes(t.tag)) S.minus++;
  applyStage(t); save(); sfx.ok();
  const msg = praise(t);
  if (run.si < run.problem.stages.length - 1) {
    run.si++; run.input = ''; run.freshLine = !!t.line; renderPlay(); toast(msg, 'ok', 1100); return;
  }
  run.freshLine = !!t.line;
  problemDone(msg);
}
function problemDone(msg) {
  const L = run.lvl, p = run.problem, multi = p.stages.length > 1;
  S.solved++; save();
  if (L.boss) {
    run.qi++;
    if (run.qi >= run.queue.length) return bossWin();
    run.lock = true; markRight(); toast(msg, 'ok', 900);
    setTimeout(() => { run.lock = false; prep(run.queue[run.qi]); renderPlay(); }, 750);
    return;
  }
  const gain = run.hinted ? 0 : multi ? (run.pm <= 1 ? 1 : 0) : 1;
  run.progress += gain;
  if (run.progress >= L.target) { run.lock = true; markRight(); toast(msg, 'ok', 900); setTimeout(() => { run.lock = false; levelWin(); }, 850); return; }
  if (multi) {
    renderPlay();
    const title = gain ? `Решено! ${msg}` : run.hinted ? 'Разобрали по шагам' : 'Решено — но ошибок многовато';
    const text = gain ? '+1 к шкале уровня.' : run.hinted ? 'С «Шагами» не засчитывается — зато теперь понятно, как.' : 'Засчитываю, когда ошибок не больше одной. Давай ещё одно — получится.';
    showSheet(`<div class="fb ${gain ? 'good' : ''}"><div class="fb-cat">${XK.catSVG(gain ? { ...XK.GUIDE, eyes: 'happy' } : XK.GUIDE, { size: 60 })}</div><h3>${esc(title)}</h3><p>${esc(text)}</p><button class="btn big" data-act="nextP">Дальше</button></div>`);
    return;
  }
  run.lock = true; markRight(); toast(msg, 'ok', 900);
  setTimeout(() => { run.lock = false; if (run) nextProblem(); }, 720);
}
function markRight() {
  if (run.problem.stages.length > 1) renderPlay();
  const pr = document.querySelector('.prog i');
  if (pr && !run.lvl.boss) pr.style.width = Math.min(100, (run.progress / run.lvl.target) * 100) + '%';
  if (pr && run.lvl.boss) pr.style.width = (run.qi / run.queue.length) * 100 + '%';
  const a = document.getElementById('ans'); if (a) a.classList.add('right');
}
function onBad(t, r, input) {
  run.streak = 0; run.bad++; run.pm++;
  rec(t.tag, false);
  if (run.lvl.boss) run.hearts--;
  save(); sfx.bad();
  const meme = typeof input === 'string' && input === '67';
  const title = meme ? 'Сикс-севен 🤷 Мем засчитан, ответ — нет' : r.sign ? pick(XK.OOPS_SIGN) : pick(XK.OOPS);
  const steps = (t.steps || []).map(s => `<li>${h(s)}</li>`).join('');
  const L = run.lvl, single = run.problem.stages.length === 1;
  const after = L.boss ? (run.hearts > 0 ? `Осталось: ${'❤️'.repeat(run.hearts)}` : 'Сердечки кончились 💔')
    : single && run.progress > 0 ? 'Шкала −1. Вернём!' : '';
  showSheet(`<div class="fb bad"><h3>${esc(title)}</h3><p>${h(r.msg)}</p>${steps ? `<div class="how">Как правильно</div><ol class="steps">${steps}</ol>` : ''}${after ? `<div class="hl">${after}</div>` : ''}<button class="btn big" data-act="afterBad">Понятно</button></div>`);
}
function afterBad() {
  hideSheet();
  const L = run.lvl, p = run.problem, t = curTask();
  if (L.boss && run.hearts <= 0) return bossFail();
  if (L.boss || p.stages.length > 1) {
    applyStage(t);
    if (run.si < p.stages.length - 1) { run.si++; run.input = ''; run.freshLine = !!t.line; renderPlay(); return; }
    run.freshLine = !!t.line;
    return problemDone('');
  }
  run.progress = Math.max(0, run.progress - 1); save();
  nextProblem();
}
function useSteps() {
  if (!run.problem.free) return;
  prep(XC.guidedEq(run.problem.eq, { special: true }));
  run.hinted = true;
  renderPlay();
  toast('Разбираем по шагам. Этот пример не засчитается, но так понятнее', 'warn', 3000);
}

/* ---------- плитки: перенос через «=» ---------- */
function initTiles(t) {
  run.tiles = t.left.map((x, i) => ({ id: 'L' + i, v: x.v, c: x.c, from: 'L', ord: i, moved: false }))
    .concat(t.right.map((x, i) => ({ id: 'R' + i, v: x.v, c: x.c, from: 'R', ord: i, moved: false })));
}
const tc = t => (t.moved ? t.c.neg() : t.c);
const onLeft = t => (t.from === 'L') !== t.moved;
const tileOK = t => (t.v ? onLeft(t) : !onLeft(t));
function tilesSides() {
  const ts = run.tiles;
  return {
    left: ts.filter(t => t.from === 'L' && !t.moved).concat(ts.filter(t => t.from === 'R' && t.moved)),
    right: ts.filter(t => t.from === 'R' && !t.moved).concat(ts.filter(t => t.from === 'L' && t.moved)),
  };
}
const tileHTML = t => `<button class="tile${t.v ? ' tv' : ''}${t.anim ? ' moved' : ''}" data-act="tile" data-id="${t.id}">${mh(XM.fmtSigned({ v: t.v, c: tc(t) }))}</button>`;
function tileTap(id) {
  if (!run || run.lock || sheetOpen()) return;
  const tile = run.tiles.find(x => x.id === id);
  if (tileOK(tile)) { sfx.warn(); return toast(tile.v ? 'Этот уже на месте: иксы живут слева' : 'Этот уже на месте: числа живут справа'); }
  run.pending = id;
  const cur = { v: tile.v, c: tc(tile) }, nxt = { v: tile.v, c: tc(tile).neg() };
  const opts = Math.random() < 0.5 ? [[cur, 0], [nxt, 1]] : [[nxt, 1], [cur, 0]];
  showSheet(`<div class="fb ask"><p class="q">Переносим ${h('`' + XM.fmtSigned(cur) + '`')} ${onLeft(tile) ? 'направо' : 'налево'} через «=». Каким он станет?</p>
    <div class="two">${opts.map(([o, n]) => `<button class="btn big ghost tilebtn" data-act="tileSign" data-neg="${n}">${mh(XM.fmtSigned(o))}</button>`).join('')}</div></div>`, { dismiss: true });
}
function tileSign(neg) {
  const tile = run && run.tiles && run.tiles.find(x => x.id === run.pending);
  if (!tile) return;
  tick();
  if (neg) {
    hideSheet(); run.streak++; run.ok++; run.best = Math.max(run.best, run.streak); S.minus++; rec('move', true); sfx.ok();
    if (XK.STREAK[run.streak]) toast(XK.STREAK[run.streak], 'ok', 1200); else if (Math.random() < 0.3) toast(pick(XK.PRAISE_MINUS), 'ok', 900);
    return moveTile(tile);
  }
  run.streak = 0; run.bad++; run.pm++; rec('move', false); sfx.bad();
  if (run.lvl.boss) run.hearts--;
  save();
  const cur = { v: tile.v, c: tc(tile) }, nxt = { v: tile.v, c: tc(tile).neg() };
  showSheet(`<div class="fb bad"><h3>${esc(pick(XK.OOPS_SIGN))}</h3><p>Перешёл через «=» — поменял знак: ${h('`' + XM.fmtSigned(cur) + '`')} → ${h('`' + XM.fmtSigned(nxt) + '`')}.</p><p class="sub">Кто остаётся на своей стороне — знак не меняет.</p><button class="btn big" data-act="afterTileBad">Понятно</button></div>`);
}
function afterTileBad() {
  hideSheet();
  if (run.lvl.boss && run.hearts <= 0) return bossFail();
  moveTile(run.tiles.find(x => x.id === run.pending));
}
function moveTile(tile) {
  tile.moved = true; tile.anim = true; save();
  renderPlay(); tile.anim = false;
  if (!run.tiles.every(tileOK)) return;
  const { left, right } = tilesSides();
  const line = '`' + XM.fmtTerms(left.map(x => ({ v: x.v, c: tc(x) }))) + ' = ' + XM.fmtTerms(right.map(x => ({ v: x.v, c: tc(x) }))) + '`';
  run.lock = true;
  setTimeout(() => {
    if (!run) return;
    run.lock = false; run.notebook.push(line); run.freshLine = true;
    if (run.si >= run.problem.stages.length - 1) return problemDone(pick(XK.PRAISE));
    run.si++; run.input = ''; renderPlay();
  }, 650);
}

/* ---------- финалы уровня ---------- */
function levelWin() {
  const L = run.lvl, l = lv(L.id), first = !l.done;
  l.done = true; l.doneAt = l.doneAt || Date.now(); save();
  const st = { ok: run.ok, bad: run.bad, best: run.best };
  run = null; lastAct = 0;
  sfx.win(); confetti();
  const cat = XK.CATS[L.id], nx = nextLevel();
  render(`<div class="center day${L.day}">
    <div class="burst">${XK.catSVG(cat, { size: 170 })}</div>
    <div class="kicker">${first ? 'Котик спасён!' : 'Пройдено ещё раз'}</div>
    <h1>${esc(cat.name)}</h1>
    <p class="power">${esc(cat.power)}</p>
    <div class="stats"><div><b>${st.ok}</b><span>верно</span></div><div><b>${st.bad}</b><span>${plural(st.bad, ['ошибка', 'ошибки', 'ошибок'])}</span></div><div><b>${st.best}</b><span>лучшая серия</span></div></div>
    ${L.boss ? `<div class="daydone">Миссия ${L.day} пройдена! 🎉 ${L.day < 3 ? 'Можно продолжить сейчас — или завтра на свежую голову.' : ''}</div>` : ''}
    ${nx ? `<button class="btn big day${nx.day}" data-act="intro" data-id="${nx.id}">Дальше: ${esc(nx.title)}</button>` : ''}
    <button class="btn ghost" data-act="home">На карту</button>
  </div>`, 'scr-saved day' + L.day);
}
function bossWin() {
  const L = run.lvl;
  if (!L.final) return levelWin();
  const l = lv(L.id); l.done = true; l.doneAt = Date.now(); S.prizeAt = S.prizeAt || Date.now(); save();
  run = null; lastAct = 0;
  scrPrize(true);
}
function bossFail() {
  const L = run.lvl; save(); run = null; lastAct = 0;
  render(`<div class="center day${L.day}">
    <div class="burst">${XK.catSVG({ ...XK.GUIDE, eyes: 'sleepy' }, { size: 140 })}</div>
    <h1>Сердечки кончились</h1>
    <p class="power">Кот уронил всё со стола. Бывает. Босса редко проходят с первой попытки — в следующий раз числа будут другие.</p>
    <button class="btn big" data-act="play" data-id="${L.id}">Ещё раз</button>
    <button class="btn ghost" data-act="cheat">Посмотреть шпаргалку</button>
    <button class="btn ghost" data-act="home">На карту</button>
  </div>`, 'scr-fail day' + L.day);
}

/* ---------- приз ---------- */
function orderText() {
  const o = S.order;
  return [`Для кого: ${o.who || '—'}`, `Что показать: ${o.what || '—'}`, `Настроение и музыка: ${o.mood || '—'}`, `Слова в конце: ${o.words || '—'}`].join('\n');
}
function scrPrize(fresh) {
  if (!S.prizeAt) {
    const left = LEVELS.length - savedCount();
    return render(`<div class="center">${bar('Приз')}<div class="burst">🎁</div><h1>Приз ещё впереди</h1><p class="power">Осталось спасти котиков: ${left}. Приз — второй ролик, как тот, для Саши.</p><button class="btn big" data-act="home">На карту</button></div>`, 'scr-prize');
  }
  const o = S.order;
  render(`<div class="center form day3">
    <div class="burst">${XK.catSVG(XK.CATS.d3b, { size: 150 })}</div>
    <div class="kicker">Икс-квест пройден</div>
    <h1>${NAME}, это было легендарно</h1>
    <div class="stats"><div><b>${S.solved}</b><span>решено задач</span></div><div><b>${S.minus}</b><span>поймано минусов</span></div><div><b>${S.bestStreak}</b><span>лучшая серия</span></div></div>
    <div class="catrow">${LEVELS.map(l => XK.catSVG(XK.CATS[l.id], { size: 40 })).join('')}</div>
    <div class="prizebox"><span>🎁</span><div><b>Твой приз — второй ролик.</b><br>Мама сделает его по твоему заказу. Напиши, каким он должен быть:</div></div>
    <label>Для кого ролик<input id="o_who" value="${esc(o.who)}" placeholder="Например, для Саши"></label>
    <label>Что обязательно показать<textarea id="o_what" rows="3" placeholder="Фото, видео, ваши моменты и шутки">${esc(o.what)}</textarea></label>
    <label>Настроение и музыка<input id="o_mood" value="${esc(o.mood)}" placeholder="Весёлое, трогательное, любимый трек"></label>
    <label>Слова в конце<input id="o_words" value="${esc(o.words)}" placeholder="Что сказать в финале"></label>
    <button class="btn big" data-act="shareOrder">Отправить заказ маме</button>
    <button class="btn ghost" data-act="home">На карту</button>
  </div>`, 'scr-prize');
  ['who', 'what', 'mood', 'words'].forEach(k => {
    const el = document.getElementById('o_' + k);
    el.addEventListener('input', () => { S.order[k] = el.value; save(); });
  });
  if (fresh) { confetti(240); sfx.win(); }
}
async function share(text, title) {
  try { if (navigator.share) { await navigator.share({ title, text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Скопировано — вставь маме в чат', 'ok'); return; } catch (e) { /* покажем текст */ }
  showSheet(`<div class="fb"><h3>Скопируй и отправь</h3><textarea style="width:100%;min-height:200px;font:inherit;background:var(--bg2);color:var(--ink);border-radius:12px;padding:10px">${esc(text)}</textarea><button class="btn" data-act="stay">Готово</button></div>`, { dismiss: true });
}

/* ---------- коллекция, шпаргалка ---------- */
function scrCats() {
  const cards = LEVELS.map(l => {
    const c = XK.CATS[l.id], got = isDone(l.id);
    return `<button class="catcard${got ? '' : ' lock'}" data-act="${got ? 'catInfo' : 'catLocked'}" data-id="${l.id}">${XK.catSVG(c, { size: 76, locked: !got })}<b>${got ? esc(c.name) : '???'}</b></button>`;
  }).join('');
  render(`<div>${bar('Котики')}<p class="sub">Спасено ${savedCount()} из ${LEVELS.length}. Нажми на котика — узнаешь его суперсилу.</p><div class="catgrid">${cards}</div></div>`, 'scr-cats');
}
function scrCheat() {
  const last = LEVELS.reduce((a, l, i) => (isOpen(i) ? i : a), 0);
  const items = LEVELS.slice(0, last + 1).filter(l => !l.boss).map(l => `<section class="cs day${l.day}"><h3>${esc(l.title)}</h3>${l.rules.map(r => `<p>${h(r)}</p>`).join('')}${l.example.length ? `<div class="csx grid-paper">${l.example.map(e => `<div>${h(e)}</div>`).join('')}</div>` : ''}</section>`).join('');
  render(`<div>${bar('Шпаргалка')}<p class="sub">Всё, что ты уже открыла. В школе тоже пригодится 😉</p>${items}</div>`, 'scr-cheat');
}

/* ---------- для мамы ---------- */
function stats() {
  const allMs = Object.values(S.time).reduce((a, b) => a + b, 0);
  const tags = Object.entries(TAGS).filter(([k]) => k !== 'unfin' && S.tags[k]).map(([k, label]) => {
    const t = S.tags[k], all = t.ok + t.bad;
    return { k, label, ok: t.ok, all, pc: all ? Math.round((t.ok / all) * 100) : 0 };
  });
  return { done: savedCount(), today: mins(S.time[today()] || 0), all: mins(allMs), tags };
}
function reportText() {
  const s = stats();
  const lines = [`Икс-квест — отчёт ${NAME} (${new Date().toLocaleDateString('ru-RU')})`, `Пройдено уровней: ${s.done} из ${LEVELS.length}`,
    `Время: сегодня ${s.today} мин, всего ${s.all} мин`, `Задач: ${S.solved}, лучшая серия: ${S.bestStreak}, не доводила до конца: ${S.unfin}`, '', 'Точность по темам:'];
  s.tags.forEach(t => lines.push(`• ${t.label}: ${t.pc}% (${t.ok} из ${t.all})`));
  lines.push('');
  DAYS.forEach(d => lines.push(`Миссия ${d.n}: ` + LEVELS.filter(l => l.day === d.n).map(l => (isDone(l.id) ? '✓' : '○')).join(' ')));
  if (S.prizeAt) lines.push('', 'Заказ на ролик:', orderText());
  return lines.join('\n');
}
function scrMom() {
  const s = stats();
  const tags = s.tags.map(t => `<li><div class="tg"><span>${esc(t.label)}</span><b>${t.pc}%</b></div><div class="bar2"><i class="${t.pc < 60 ? 'low' : t.pc < 80 ? 'mid' : ''}" style="width:${t.pc}%"></i></div><div class="tgn">верно ${t.ok} из ${t.all}</div></li>`).join('');
  const lvs = DAYS.map(d => `<h4>Миссия ${d.n}. ${esc(d.title)}</h4><ul class="lv">${LEVELS.filter(l => l.day === d.n).map(l => {
    const x = S.levels[l.id];
    return `<li class="${x && x.done ? 'ok' : ''}"><span>${x && x.done ? '✓' : '○'} ${esc(l.title)}</span><span class="n">${x ? `${x.ok} ✓ · ${x.bad} ✗` : '—'}</span></li>`;
  }).join('')}</ul>`).join('');
  const days = Object.keys(S.time).sort().map(k => `<li>${k.split('-').reverse().join('.')}: ${mins(S.time[k])} мин</li>`).join('');
  render(`<div class="mom">${bar('Для мамы')}
    <div class="kpi"><div><b>${s.done}/${LEVELS.length}</b><span>уровней</span></div><div><b>${s.today}</b><span>мин сегодня</span></div><div><b>${s.all}</b><span>мин всего</span></div></div>
    <p class="sub">Задач пройдено: ${S.solved} · лучшая серия: ${S.bestStreak} · не доводила до конца: ${S.unfin} раз</p>
    <h3>Точность по темам</h3>${tags ? `<ul class="tags">${tags}</ul>` : '<p class="sub">Пока пусто — игра ещё не начиналась.</p>'}
    <h3>Уровни</h3>${lvs}
    ${days ? `<h3>По дням</h3><ul class="days">${days}</ul>` : ''}
    ${S.prizeAt ? `<h3>Заказ на ролик</h3><div class="order">${esc(orderText())}</div>` : ''}
    <button class="btn big" data-act="shareReport">Отправить отчёт</button>
    <details class="pinbox"><summary>Если прогресс сбился</summary>
      <p class="sub">Мамин код откроет уровни до выбранной миссии.</p>
      <input id="pin" inputmode="numeric" maxlength="4" placeholder="Код" autocomplete="off">
      <div class="two"><button class="btn ghost" data-act="unlock" data-day="1">Открыть миссию 2</button><button class="btn ghost" data-act="unlock" data-day="2">Открыть миссию 3</button></div>
      <button class="btn ghost danger" data-act="resetAll">Стереть весь прогресс</button>
    </details>
  </div>`, 'scr-mom');
}
const pinOK = () => { const el = document.getElementById('pin'); if (el && el.value === MOM_PIN) return true; toast('Неверный код'); return false; };

/* ================= СОБЫТИЯ ================= */
const ACT = {
  startGame() { S.onboarded = true; save(); sfx.meow(); scrHome(); },
  home() { hideSheet(); scrHome(); },
  intro(d) { hideSheet(); scrIntro(d.id); },
  locked() { sfx.warn(); toast('Сначала пройди уровень перед ним — котиков спасаем по очереди'); },
  catLocked() { sfx.warn(); toast('Этого котика ещё надо спасти'); },
  play(d) { hideSheet(); startLevel(d.id); },
  key(d) {
    if (!run || run.lock || sheetOpen()) return;
    if (d.k === 'back') run.input = run.input.slice(0, -1);
    else if (run.input.length < 22) run.input += d.k;
    sfx.tap(); updateField();
  },
  submit() { if (run) submit(run.input); },
  special(d) { submit({ special: d.v }); },
  choice(d) { submit({ choice: +d.i }); },
  errline(d) { submit({ line: +d.i }); },
  tile(d) { tileTap(d.id); },
  tileSign(d) { tileSign(d.neg === '1'); },
  afterBad() { if (run) afterBad(); },
  afterTileBad() { if (run) afterTileBad(); },
  nextP() { hideSheet(); if (run) nextProblem(); },
  steps() { if (run && !run.lock) useSteps(); },
  quit() {
    if (!run) return scrHome();
    showSheet(`<div class="fb"><h3>Выйти из уровня?</h3><p>${run.lvl.boss ? 'Босса потом придётся начать заново.' : 'Шкала уровня начнётся сначала.'}</p><div class="two"><button class="btn ghost" data-act="stay">Остаться</button><button class="btn" data-act="home">Выйти</button></div></div>`, { dismiss: true });
  },
  stay() { hideSheet(); },
  sound() { S.sound = !S.sound; save(); scrHome(); },
  cats() { scrCats(); },
  cheat() { scrCheat(); },
  mom() { scrMom(); },
  prize() { scrPrize(false); },
  catInfo(d) { const c = XK.CATS[d.id]; sfx.meow(); showSheet(`<div class="fb catinfo">${XK.catSVG(c, { size: 150 })}<h3>${esc(c.name)}</h3><p>${esc(c.power)}</p><button class="btn" data-act="stay">Мяу</button></div>`, { dismiss: true }); },
  shareOrder() { share(`Мама, я прошла Икс-квест! 🐱 Спасла всех 16 котиков.\n\nЗаказ на второй ролик:\n${orderText()}`, 'Заказ на ролик'); },
  shareReport() { share(reportText(), 'Икс-квест — отчёт'); },
  unlock(d) {
    if (!pinOK()) return;
    LEVELS.forEach(l => { if (l.day <= +d.day) { lv(l.id).done = true; } }); save();
    toast('Готово: миссия ' + (+d.day + 1) + ' открыта', 'ok'); scrMom();
  },
  resetAll() {
    if (!pinOK()) return;
    showSheet(`<div class="fb"><h3>Стереть весь прогресс?</h3><p>Все котики и статистика пропадут. Вернуть будет нельзя.</p><div class="two"><button class="btn ghost" data-act="stay">Нет</button><button class="btn" data-act="resetYes">Стереть</button></div></div>`, { dismiss: true });
  },
  resetYes() { S = fresh(); save(); hideSheet(); scrOnboard(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el.dataset, el); }
});
$scrim.addEventListener('click', () => { if ($scrim.dataset.dismiss) hideSheet(); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (sheetOpen()) {
    if (e.key === 'Enter' || e.key === 'Escape') { const b = $sheet.querySelector('.btn[data-act]'); if (b && e.key === 'Enter') b.click(); else if ($scrim.dataset.dismiss) hideSheet(); e.preventDefault(); }
    return;
  }
  if (!run || run.lock) return;
  const t = curTask();
  if (t.type !== 'num' && t.type !== 'expr') return;
  const k = e.key;
  if (/^[0-9]$/.test(k) || k === ',' || k === '.' || k === '/' || k === '+' || k === '-') ACT.key({ k: k === '.' ? ',' : k });
  else if (/^[a-z]$/.test(k) && (t.vars || []).includes(k)) ACT.key({ k });
  else if (k === 'Backspace') ACT.key({ k: 'back' });
  else if (k === 'Enter') ACT.submit();
  else return;
  e.preventDefault();
});


/* офлайн: только на настоящем сайте (https), не на локальном сервере */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

if (!S.onboarded) scrOnboard(); else scrHome();
})();

</script>
